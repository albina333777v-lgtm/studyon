ss=\"fc bk\"><q>Поставлю вам красивый британский акцент<\/q><ul><li>6 лет преподаёт<\/li><li>Учитель двух языков<\/li><\/ul><\/span>\n      <\/span><\/button>\n      <button class=\"tf\" type=\"button\"><span class=\"tf-in\">\n        <span class=\"fc\"><span class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/span><span class=\"cap\"><b>Мистер Аман<\/b><span>Разговорный английский<\/span><\/span><\/span>\n        <span class=\"fc bk\"><q>Учим английский через фильмы и песни<\/q><ul><li>Неординарные уроки<\/li><li>Нужно быть активным!<\/li><\/ul><\/span>\n      <\/span><\/button>\n      <button class=\"tf\" type=\"button\"><span class=\"tf-in\">\n        <span class=\"fc\"><span class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/span><span class=\"cap\"><b>Мисс Виктория<\/b><span>Общий английский<\/span><\/span><\/span>\n        <span class=\"fc bk\"><q>Училась и преподавала в Южной Корее<\/q><ul><li>You &amp; I English Academy<\/li><li>Опыт 3+ года<\/li><\/ul><\/span>\n      <\/span><\/button>\n      <button class=\"tf\" type=\"button\"><span class=\"tf-in\">\n        <span class=\"fc\"><span class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/span><span class=\"cap\"><b>Мистер Рензе<\/b><span>Носитель · Talking Club<\/span><\/span><\/span>\n        <span class=\"fc bk\"><q>Из Голландии — и знает казахский<\/q><ul><li>Ведёт Talking Club<\/li><li>Прокачает разговорный<\/li><\/ul><\/span>\n      <\/span><\/button>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- Отзывы -->\n<section class=\"sec\" id=\"reviews\" aria-labelledby=\"h-r\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"stk\"><svg><use href=\"#i-chat\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-r\">Нам пишут<\/h2><p>Примеры отзывов из переписки — заменим на настоящие.<\/p><\/div><\/div>\n    <div class=\"chats\">\n      <div class=\"ch\"><div class=\"ch-h\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/ ,20.5,\"IELTS · вечер\",\"#8FD8FF\"]]},\n    {n:\"Talking Club\",g:[[17,18,\"Club с Рензе\",\"#9BF0B9\"]]}\n  ];\n  var tl=document.getElementById(\"tl\");\n  function pos(h){return ((h-9)/12*100)+\"%\";}\n  tl.innerHTML=R.map(function(r){return '<div class=\"tl-row\"><span>'+r.n+'<\/span><div class=\"tl-bar\">'+r.g.map(function(g){return '<i style=\"left:'+pos(g[0])+';width:calc('+((g[1]-g[0])/12*100)+'% - 4px);background:'+g[3]+'\" title=\"'+g[2]+'\">'+g[2]+'<\/i>';}).join(\"\")+'<\/div><\/div>';}).join(\"\")+\n    '<div class=\"tl-scale\"><span><\/span><div><span>9:00<\/span><span>12:00<\/span><span>15:00<\/span><span>18:00<\/span><span>21:00<\/span><\/div><\/div><div class=\"tl-area\"><span class=\"tl-now\" id=\"tlNow\"><\/span><\/div>';\n  function bish(){var d=new Date();return new Date(d.getTime()+d.getTimezoneOffset()*60000+6*3600000);}\n  function tick(){\n    var b=bish(), h=b.getHours()+b.getMinutes()/60, day=b.getDay(), open=day!==0&&h>=9&&h<21;\n    document.getElementById(\"clk\").textContent=String(b.getHours()).padStart(2,\"0\")+\":\"+String(b.getMinutes()).padStart(2,\"0\");\n    var nowEl=document.getElementById(\"tlNow\"), dot=document.getElementById(\"dot\");\n    nowEl.style.display=open?\"\":\"none\"; if(open) nowEl.style.left=pos(h);\n    dot.className=open?\"\":\"off\";\n    var cur=[]; R.forEach(function(r){r.g.forEach(function(g){if(open&&h>=g[0]&&h<g[1])cur.push(g[2]);});});\n    document.getElementById(\"stT\").textContent=open?\"Открыто\":\"Сейчас закрыто\";\n    document.getElementById(\"stP\").textContent=open?(cur.length?\"Идёт урок: \"+cur.join(\", \")+\". Заходите на пробный!\":\"Сейчас перерыв между группами — самое время позвонить.\"):(day===0?\"Воскресенье — выходной. Напишите в WhatsApp, ответим утром в понедельник.\":\"Откроемся в 9:00. Напишите в WhatsApp — ответим утром.\");\n  }\n  tick(); setInterval(tick,30000);\n\n  /* отсчёт до осеннего набора — 17 ноября 2026, 9:00 по Бишкеку */\n  var start=Date.UTC(2026,10,17,3,0);\n  function cd(){\n    var ms=Math.max(0,start-Date.now()), m=Math.floor(ms/60000);\n    document.getElementById(\"cdD\").textContent=Math.floor(m/1440);\n    document.getElementById(\"cdH\").textContent=Math.floor(m%1440/60);\n    document.getElementById(\"cdM\").textContent=m%60;\n  }\n  cd(); setInterval(cd,30000);\n\n  /* учителя: на телефоне переворот по нажатию */\n  document.querySelectorAll(\".tf\").forEach(function(t){t.onclick=function(){t.classList.toggle(\"flip\");};});\n\n  /* филиалы */\n  var B=[\n    {t:\"Асанбай\",a:\"Бишкек, ул. Арстанбека Дуйшеева, 6/4, ЖК «Park Avenue», район «Английский квартал»\",g:\"asanbay\",p:\"Дуйшеева, 6/4\"},\n    {t:\"Филармония\",a:\"Бишкек, проспект Манаса, 64/1 — ориентир: Филармония\",g:\"filarm\",p:\"пр. Манаса, 64/1\"},\n    {t:\"Токмок\",a:\"Токмок, ул. Шамсинская, 44\",g:\"tokmok\",p:\"Шамсинская, 44\"}\n  ];\n  var tabs=[].slice.call(document.querySelectorAll(\".tabs button\"));\n  function br(i){\n    var b=B[i];\n    tabs.forEach(function(t){t.setAttribute(\"aria-selected\",+t.dataset.b===i);});\n    document.getElementById(\"bT\").textContent=b.t;\n    document.getElementById(\"bA\").textContent=b.a;\n    document.getElementById(\"bPl\").textContent=b.p;\n    document.getElementById(\"bG\").dataset.gis=b.g;\n    document.getElementById(\"bW\").dataset.wa=\"Здравствуйте! Хочу на пробный урок в филиал StudyOn «\"+b.t+\"»\";\n    SOwa();\n  }\n  tabs.forEach(function(t){t.onclick=function(){br(+t.dataset.b);};});\n  br(0);\n\n  SOtest(document.getElementById(\"quiz\"));\n})();\n<\/script>\n<\/body>\n<\/html>\n"};</script><!--DESIGNS:END-->
<script>
const D={
  1:{file:"v1-vklyuchi.html",name:"Включи",info:"Фирменный чёрно-жёлтый StudyOn: «O» из логотипа — тумблер. Фишка: экран переключается OFF → ON («Понимаю. Но молчу» → «I speak English!»), переписка Talking Club, тест на 10 вопросов, отзывы «было OFF → стало ON»",
     mob:["Тумблер — маленький, над заголовком; нажимается пальцем","Кружки-разделы листаются вбок, как хайлайты","Курсы и отзывы — карточки в одну колонку","Тест: ответы в столбик, результат → WhatsApp","Внизу всегда панель: Позвонить · WhatsApp · 2ГИС"]},
  2:{file:"v2-6nedel.html",name:"6 недель",info:"Минимализм: белый фон, одна гарнитура Jost, жёлтый только как маркер. Анимация — путь в 6 недель: фраза студента растёт от «Hi!» до рассказа о себе. Подбор курса по цели → WhatsApp, цены строками, FAQ",
     mob:["Анимация 6 недель — сразу под заголовком","Цели — крупные кнопки, курс обновляется сразу","Цены и преподаватели — строки, без лишних карточек","Вопросы раскрываются по нажатию","Нижняя панель: Позвонить · WhatsApp · 2ГИС"]},
  3:{file:"v3-govorim.html",name:"Говорим!",info:"Яркий для школьников, студентов и родителей: жёлтый + стикеры с толстой рамкой. Фишки: карточка «Скажи по-английски», бегущая строка, живая шкала «Сейчас в StudyOn», отсчёт до набора, учителя-перевёртыши, тест на 10 вопросов",
     mob:["Карточка-фраза переворачивается по нажатию","«Сейчас в StudyOn» — часы и полосы групп друг под другом","Учителя переворачиваются по нажатию","Отзывы — как переписка в WhatsApp","Нижняя панель: Позвонить · WhatsApp · 2ГИС"]}
};
let v="1", d="pc";
const frame=document.getElementById("frame"), phone=document.getElementById("phone");
function readHash(){const m=location.hash.match(/v([123])-(pc|mob)/); if(m){v=m[1];d=m[2];}}
function fit(){
  if(d!=="mob"){phone.style.transform="";phone.style.margin="";return;}
  const st=document.getElementById("stage").getBoundingClientRect();
  const s=Math.min(1,(st.height-40)/900,(st.width-40)/414);
  phone.style.transform=`scale(${s})`;
  phone.style.margin=`${-(900*(1-s))/2}px ${-(414*(1-s))/2}px`;
}
let shown=null;
function apply(){
  const want=D[v].file;
  if(shown!==want){shown=want; frame.srcdoc=DESIGNS[want];}
  document.body.className=d;
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  document.querySelectorAll("[data-d]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===d));
  document.getElementById("info").textContent=D[v].info;
  document.getElementById("notes").innerHTML=`<h2>${D[v].name}: телефон</h2><p>Что сделано для мобильной версии:</p><ul>${D[v].mob.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  document.title="StudyOn — "+D[v].name+(d==="mob"?" (телефон)":"");
  history.replaceState(null,"","#v"+v+"-"+d);
  fit();
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{v=b.dataset.v;apply();});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{d=b.dataset.d;apply();});
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea"))return;
  if(["1","2","3"].includes(e.key)){v=e.key;apply();}
  if(e.key==="m"||e.key==="ь"){d=d==="pc"?"mob":"pc";apply();}
});
addEventListener("resize",fit);
// ссылки-якоря внутри макета прокручивают страницу, а не перезагружают рамку
frame.addEventListener("load",()=>{
  const doc=frame.contentDocument;
  doc.addEventListener("click",e=>{
    const link=e.target.closest('a[href^="#"]'); if(!link)return;
    e.preventDefault();
    const id=link.getAttribute("href").slice(1), target=id&&doc.getElementById(id);
    if(target)target.scrollIntoView({behavior:"smooth"}); else frame.contentWindow.scrollTo({top:0,behavior:"smooth"});
  });
});
readHash(); apply();
</script>
