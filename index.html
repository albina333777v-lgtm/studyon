<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyOn — макеты сайта</title>
<style>
  /* Просмотрщик: тёмная полоса сверху + сцена. ПК — макет на всю ширину, Телефон — макет в рамке 390×844 */
  :root{--bg:#ECECEE;--bar:#141414;--ink:#141414;--muted:#66666d;--body:system-ui,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);display:flex;flex-direction:column;overflow:hidden}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bar);color:#fff;
    padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
  .brand{font-weight:700;font-size:15px;letter-spacing:.08em;white-space:nowrap}
  .brand span{font-weight:400;letter-spacing:0;color:#9a9a9a;margin-left:6px}

  .sw{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
  .seg{display:flex;background:#2a2a2a;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;font:600 13.5px var(--body);color:#cfcfcf;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--bar)}
  .seg button:hover{color:#fff}
  .seg button[aria-pressed="true"]:hover{color:var(--bar)}
  .seg button:focus-visible{outline:2px solid #FFE000;outline-offset:2px}
  .seg svg{width:15px;height:15px}
  @media (max-width:760px){.info{display:none}.sw{margin-left:0;width:100%}.seg{flex:1}.seg button{flex:1;justify-content:center;padding:7px 6px}}
  #stage{flex:1;min-height:0;position:relative}
  #frameWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:40px}
  iframe{border:0;display:block;background:#fff}
  .pc iframe{width:100%;height:100%}
  .pc aside{display:none}
  .mob #frameWrap{padding:20px}
  .phone{flex:0 0 auto;width:414px;height:900px;border-radius:54px;background:#111;padding:44px 12px 12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);position:relative;transform-origin:center}
  .phone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:22px;border-radius:20px;background:#111;z-index:2}
  .pc .phone{width:100%;height:100%;border-radius:0;padding:0;background:none;box-shadow:none;transform:none!important;margin:0!important}
  .pc .phone::before{display:none}
  .mob iframe{width:390px;height:844px;border-radius:6px 6px 42px 42px}
  aside{max-width:300px;align-self:center}
  aside h2{font-size:18px;margin:0 0 4px}
  aside p{color:var(--muted);margin:0 0 14px}
  aside ul{margin:0;padding-left:18px;line-height:1.55}
  aside li{margin:6px 0}
  @media (max-width:980px){aside{display:none}}
</style>
</head>
<body class="pc">

<div class="bar">
  <div class="brand">StudyOn<span>макеты сайта</span></div>
  <div class="info" id="info"></div>
  <div class="sw">
    <div class="seg" role="group" aria-label="Выбор дизайна">
      <button data-v="1" aria-pressed="true">1 · Включи</button>
      <button data-v="2" aria-pressed="false">2 · 6 недель · минимализм</button>
      <button data-v="3" aria-pressed="false">3 · Говорим!</button>
    </div>
    <div class="seg" role="group" aria-label="Устройство">
      <button data-d="pc" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>ПК</button>
      <button data-d="mob" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Телефон</button>
    </div>
  </div>
</div>

<main id="stage">
  <div id="frameWrap">
    <div class="phone" id="phone"><iframe id="frame" title="Макет сайта"></iframe></div>
    <aside id="notes"></aside>
  </div>
</main>

<!--DESIGNS:START--><script>const DESIGNS={"v1-vklyuchi.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>StudyOn — курсы английского в Бишкеке и Токмоке<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap\">\n<style>\n/* ===== Вариант 1 «Включи» — фирменный стиль StudyOn: чёрный + жёлтый как в их хайлайтах,\n   буква «O» логотипа — тумблер. Фишка: большой тумблер на первом экране OFF → ON\n   (экран из чёрного становится жёлтым, «Понимаю, но молчу» → «I speak English»). ===== */\n:root{\n  --y:#FFE000;--y-d:#F2CF00;--k:#000;--ink:#161616;--muted:#5E5E5A;--line:#E6E4DA;--paper:#F6F5EF;\n  --h:\"Montserrat Alternates\",system-ui,sans-serif;--b:\"Wix Madefor Text\",system-ui,\"Segoe UI\",sans-serif;\n  --mb-bg:#000;--mb-fg:#fff;--ph-bg:#EFEDE3;--ph-fg:#C9C3A6;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:84px}\nbody{margin:0;background:#fff;color:var(--ink);font:400 17px/1.6 var(--b);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\nimg{max-width:100%}\n.wrap{width:min(1180px,100% - 48px);margin-inline:auto}\n:focus-visible{outline:3px solid var(--y);outline-offset:3px;box-shadow:0 0 0 6px #000}\nh1,h2,h3{font-family:var(--h);margin:0;letter-spacing:-.02em;line-height:1.08}\nh2{font-size:clamp(30px,3.5vw,46px);font-weight:800}\nh3{font-size:21px;font-weight:700}\np{margin:0}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 26px;font:700 16px/1 var(--b);text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s}\n.btn svg{width:20px;height:20px}\n.btn:hover{transform:translateY(-2px)}\n.btn-k{background:#000;color:#fff}\n.btn-y{background:var(--y);color:#000}\n.btn-wa{background:#25D366;color:#fff}\n.btn-line{background:transparent;box-shadow:inset 0 0 0 2px currentColor}\n\n/* ----- заголовок раздела: жёлтый круг со значком (как хайлайты в их Instagram) ----- */\n.sec{padding:108px 0}\n.sh{display:flex;gap:22px;align-items:center;margin-bottom:52px}\n.hl{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 0 0 6px #D9D7CC}\n.hl svg{width:28px;height:28px}\n.sh .t{flex:1}\n.sh p{color:var(--muted);margin-top:8px;max-width:58ch}\n.on-dark .sh p{color:#B8B8B0}\n.on-dark .hl{box-shadow:0 0 0 4px #000,0 0 0 6px #444}\n\n/* ----- шапка ----- */\nheader{position:sticky;top:0;z-index:50;background:#000;color:#fff}\n.hd{display:flex;align-items:center;gap:28px;height:72px}\n.logo{display:flex;align-items:center;font:800 22px/1 var(--h);letter-spacing:.02em;text-decoration:none;color:#fff}\n.logo svg{width:38px;height:23px;color:var(--y);margin:0 1px 0 3px}\n.nav{display:flex;gap:22px;font-size:15px}\n.nav a{text-decoration:none;color:#C9C9C2;white-space:nowrap}\n.nav a:hover{color:var(--y)}\n.hd-r{margin-left:auto;display:flex;align-items:center;gap:12px}\n.tel{display:flex;flex-direction:column;text-decoration:none;line-height:1.15;text-align:right}\n.tel b{font-size:17px;white-space:nowrap}\n.tel small{color:#A3A39B;font-size:12.5px}\n.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-decoration:none}\n.ib svg{width:22px;height:22px}\n.ib.wa{background:#25D366;color:#fff}\n.ib.gis{background:#2FB540;color:#fff}\n.hd .btn{padding:13px 20px;font-size:15px}\n\n/* ----- первый экран с тумблером ----- */\n.hero{background:#000;color:#fff;transition:background .55s ease,color .55s ease;overflow:hidden}\n.hero.is-on{background:var(--y);color:#000}\n.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;min-height:calc(100vh - 72px);max-height:760px;padding:56px 0 64px}\n.hero .kick{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);transition:background .55s}\n.hero.is-on .kick{background:rgba(0,0,0,.08)}\n.hero .kick svg{width:18px;height:18px}\n.h1w{position:relative;margin:26px 0 22px;min-height:2.1em;font-size:clamp(46px,6.6vw,92px)}\n.h1w h1{font-size:1em;font-weight:800;line-height:1;position:absolute;inset:0 auto auto 0;transition:opacity .4s,transform .45s}\n.h1w .off{opacity:1}\n.h1w .on{opacity:0;transform:translateY(24px)}\n.hero.is-on .h1w .off{opacity:0;transform:translateY(-24px)}\n.hero.is-on .h1w .on{opacity:1;transform:none}\n.h1w h1.sr{position:static;opacity:1;transform:none}\n.sub{position:relative;min-height:3.4em;max-width:46ch;font-size:19px}\n.sub span{position:absolute;inset:0;transition:opacity .4s}\n.sub .on{opacity:0}\n.hero.is-on .sub .off{opacity:0}\n.hero.is-on .sub .on{opacity:1}\n.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}\n.hero .btn-main{background:var(--y);color:#000;transition:background .55s,color .55s,transform .15s}\n.hero.is-on .btn-main{background:#000;color:#fff}\n.facts{display:flex;gap:34px;margin-top:44px;flex-wrap:wrap}\n.facts div{line-height:1.2}\n.facts b{display:block;font:800 30px/1 var(--h)}\n.facts span{font-size:14px;opacity:.7}\n\n.sw{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:22px}\n.big{position:relative;width:min(380px,100%);aspect-ratio:380/210;border-radius:999px;border:10px solid #fff;background:transparent;cursor:pointer;padding:0;transition:border-color .55s}\n.hero.is-on .big{border-color:#000}\n.big .knob{position:absolute;top:50%;left:7%;width:38%;aspect-ratio:1;border-radius:50%;background:#fff;transform:translateY(-50%);transition:left .55s cubic-bezier(.7,-.3,.3,1.35),background .55s;display:grid;place-items:center}\n.hero.is-on .big .knob{left:55%;background:#000}\n.big .lbl ay:grid;place-items:center}\n.reasons svg{width:20px;height:20px}\n.reasons b{display:block;font-size:16.5px;margin-bottom:2px}\n.reasons p{color:var(--muted);font-size:15px;line-height:1.45}\n\n/* ----- курсы ----- */\n.paper{background:var(--paper)}\n.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}\n.cc{background:#fff;border-radius:28px;padding:30px 28px;display:flex;flex-direction:column;gap:14px;position:relative}\n.cc .ci{width:52px;height:52px;border-radius:16px;background:#000;color:var(--y);display:grid;place-items:center}\n.cc .ci svg{width:26px;height:26px}\n.cc p{color:var(--muted);font-size:15.5px;flex:1}\n.cc .who{font-size:13.5px;font-weight:700;background:var(--paper);border-radius:999px;padding:5px 12px;align-self:flex-start}\n.cc .pr{font:800 22px/1 var(--h)}\n.cc .pr small{font:500 13px var(--b);color:var(--muted);display:block;margin-top:6px}\n.cc a.more{font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:8px}\n.cc a.more svg{width:18px;height:18px;color:#25D366}\n.cc.feat{background:#000;color:#fff}\n.cc.feat .ci{background:var(--y);color:#000}\n.cc.feat p,.cc.feat .pr small{color:#BDBDB5}\n.cc.feat .who{background:#222}\n.note{font-size:13.5px;color:var(--muted);margin-top:22px}\n\n/* ----- Talking Club ----- */\n.club{background:#000;color:#fff}\n.club-g{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}\n.chat{display:flex;flex-direction:column;gap:12px;max-width:440px}\n.msg{padding:14px 18px;border-radius:22px 22px 22px 6px;background:#1E1E1E;max-width:85%;font-size:16px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}\n.msg.me{align-self:flex-end;background:var(--y);color:#000;border-radius:22px 22px 6px 22px}\n.msg small{display:block;font-size:12.5px;opacity:.6;margin-bottom:3px;font-weight:600}\n.msg.in{opacity:1;transform:none}\n.club ul{list-style:none;padding:0;margin:26px 0 30px;display:grid;gap:12px}\n.club li{display:flex;gap:12px;align-items:center}\n.club li svg{width:22px;height:22px;color:var(--y)}\n\n/* ----- преподаватели ----- */\n.team{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}\n.tc .ph{aspect-ratio:1/1;border-radius:28px}\n.tc .badge{position:absolute;left:14px;bottom:14px;background:var(--y);color:#000;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}\n.tc h3{margin:18px 0 4px}\n.tc .spec{font-weight:600;font-size:15px}\n.tc p{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.5}\n\n/* ----- тест ----- */\n.test{background:var(--y)}\n.test-g{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}\n.test .hl{background:#000;color:var(--y);box-shadow:0 0 0 4px var(--y),0 0 0 6px #000}\n.test .sh p{color:#3D3A20}\n.test-side ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;font-weight:600}\n.test-side li{display:flex;gap:10px;align-items:center}\n.test-side li svg{width:20px;height:20px}\n.qbox{background:#fff;border-radius:30px;padding:34px;min-height:420px;\n  --qa:#000;--qopt:#F6F5EF;--qh:var(--h);--qtrack:#EAE8DD;--qnext:var(--paper);--qcall:#000;--qr:18px}\n\n/* ----- будни / расписание ----- */\n.week{display:grid;grid-template-columns:1.25fr .75fr;gap:32px}\n.days{background:#fff;border-radius:28px;padding:30px;border:2px solid #000}\n.days-h{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}\n.days-h span{text-align:center;font:800 15px/1 var(--h);padding:12px 0;border-radius:14px;background:#000;color:#fff}\n.days-h span.off{background:var(--paper);color:#A5A39A}\n.slots{display:grid;gap:12px}\n.slot{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px;border-radius:18px;background:var(--paper)}\n.slot .ti{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--h);white-space:nowrap}\n.slot .ti svg{width:22px;height:22px}\n.slot p{color:var(--muted);font-size:15px}\n.slot a{font-weight:700;font-size:14.5px;text-decoration:none; =\"37\" height=\"21\" rx=\"10.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><circle cx=\"28\" cy=\"12\" r=\"6.5\" fill=\"currentColor\"/><\/symbol>\n<\/svg>\n\n<style>\n.mbar{display:none}\n.ph{position:relative;overflow:hidden;background:var(--ph-bg,#f1efe6);color:var(--ph-fg,#b9b39a)}\n.ph>svg.ph-i{position:absolute;left:50%;bottom:-6%;width:78%;height:78%;transform:translateX(-50%);opacity:.55}\n@media (max-width:760px){\n  body{padding-bottom:78px}\n  .mbar{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--mb-bg,#fff);box-shadow:0 -8px 24px rgba(0,0,0,.14)}\n  .mbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;padding:8px 4px;font:700 12px/1.2 system-ui,sans-serif;text-decoration:none;color:var(--mb-fg,#222);background:rgba(127,127,127,.15)}\n  .mbar svg{width:22px;height:22px}\n  .mbar a.wa{background:#25D366;color:#fff;font-size:13px}\n  .mbar a.gis{background:#2FB540;color:#fff}\n}\n/* ===== Тест уровня (10 вопросов) — общий для вариантов 1 и 3.\n   Цвета задаёт вариант через переменные на контейнере:\n   --qa акцент, --qopt фон ответа, --qh шрифт заголовков, --qtrack пустые полоски,\n   --qnext фон блока «что дальше», --qcall/--qcallfg кнопка «Позвонить», --qr скругление */\n.qt{display:flex;flex-direction:column}\n.qt-prog{display:flex;gap:5px;margin-bottom:18px}\n.qt-prog i{flex:1;height:6px;border-radius:6px;background:var(--qtrack,rgba(127,127,127,.2))}\n.qt-prog i.on{background:var(--qa,#000)}\n.qt-n{font-size:14px;font-weight:600;opacity:.7}\n.qt-q{font-family:var(--qh,inherit);font-weight:700;font-size:clamp(21px,2.3vw,28px);line-height:1.3;margin:8px 0 20px}\n.qt-q u{text-decoration:none;border-bottom:3px dotted var(--qa,#000);padding:0 8px}\n.qt-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.qt-opts button{border:0;background:var(--qopt,#fff);color:inherit;border-radius:var(--qr,16px);padding:15px 18px;text-align:left;font-family:inherit;font-weight:600;font-size:16.5px;line-height:1.2;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}\n.qt-opts button:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--qa,#000)}\n.qt-opts button.ok{background:#1FA36B;color:#fff}\n.qt-opts button.no{background:#E5484D;color:#fff}\n.qt-opts button:disabled{cursor:default}\n.qt-lvl{font-family:var(--qh,inherit);font-weight:800;font-size:clamp(32px,3.8vw,46px);line-height:1.05;color:var(--qa,#000);margin:6px 0 10px}\n.qt-dots{display:flex;gap:4px;margin:2px 0 14px}\n.qt-dots i{width:16px;height:8px;border-radius:4px;background:#E5484D;opacity:.75}\n.qt-dots i.ok{background:#1FA36B;opacity:1}\n.qt-res p{margin:0 0 16px}\n.qt-next{background:var(--qnext,rgba(127,127,127,.1));border-radius:var(--qr,16px);padding:16px 18px}\n.qt-next b{display:block;margin-bottom:12px}\n.qt-btns{display:flex;gap:8px;flex-wrap:wrap}\n.qt-btns a,.qt-btns button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--qr,16px);padding:13px 18px;font-family:inherit;font-weight:700;font-size:15px;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}\n.qt-btns svg{width:18px;height:18px}\n.qt-wa{background:#25D366;color:#fff}\n.qt-call{background:var(--qcall,var(--qa,#000));color:var(--qcallfg,#fff)}\n.qt-btns .qt-again{background:none;color:inherit;text-decoration:underline;opacity:.75;padding:13px 6px}\n@media (max-width:760px){.qt-opts{grid-template-columns:1fr}.qt-btns a{flex:1}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}\n<\/style>\n<nav class=\"mbar\" aria-label=\"Быстрая связь\">\n  <a href=\"tel:+996990313800\"><svg><use href=\"#i-phone\"/><\/svg><span>Позвонить<\/span><\/a>\n  <a class=\"wa\" <\/i>';}).join(\"\")+'<\/div>';\n      if(qi>=n){\n        var sc=ans.filter(Boolean).length, r=LV[MAP[sc]];\n        var wa=\"Здравствуйте! Прошёл(а) тест на сайте StudyOn: \"+sc+\" из 10, уровень \"+r.n+\". Хочу записаться на бесплатный пробный урок.\";\n        el.innerHTML=prog+'<div class=\"qt-res\" aria-live=\"polite\"><span class=\"qt-n\">Ваш примерный уровень<\/span>'+\n          '<div class=\"qt-lvl\">'+r.n+'<\/div>'+\n          '<div class=\"qt-dots\" role=\"img\" aria-label=\"'+sc+' из 10\">'+ans.map(function(a){return '<i class=\"'+(a?\"ok\":\"\")+'\"><\/i>';}).join(\"\")+'<\/div>'+\n          '<p><b>Правильных ответов: '+sc+' из 10. <\/b>'+r.t+'<\/p>'+\n          '<div class=\"qt-next\"><b>Что дальше? Отправьте результат — подберём группу и запишем на бесплатный пробный урок.<\/b>'+\n          '<div class=\"qt-btns\"><a class=\"qt-wa\" target=\"_blank\" rel=\"noopener\" href=\"'+window.SOwaLink(wa)+'\"><svg><use href=\"#i-wa\"/><\/svg>Отправить в WhatsApp<\/a>'+\n          '<a class=\"qt-call\" href=\"tel:+996990313800\"><svg><use href=\"#i-phone\"/><\/svg>Позвонить<\/a>'+\n          '<button class=\"qt-again\" type=\"button\">Пройти заново<\/button><\/div><\/div><\/div>';\n        el.querySelector(\".qt-again\").onclick=function(){qi=0;ans=[];draw();};\n        return;\n      }\n      var q=Q[qi];\n      el.innerHTML=prog+'<span class=\"qt-n\">Вопрос '+(qi+1)+' из '+n+' · вставьте пропущенное слово<\/span>'+\n        '<div class=\"qt-q\">'+q[0].replace(\"___\",\"<u>&nbsp;?&nbsp;<\/u>\")+'<\/div>'+\n        '<div class=\"qt-opts\">'+q[1].map(function(o,i){return '<button type=\"button\" data-i=\"'+i+'\">'+o+'<\/button>';}).join(\"\")+'<\/div>';\n      el.querySelectorAll(\".qt-opts button\").forEach(function(b){\n        b.onclick=function(){\n          if(lock)return; lock=true;\n          var ok=+b.dataset.i===q[2]; ans.push(ok);\n          el.querySelectorAll(\".qt-opts button\").forEach(function(x){x.disabled=true; if(+x.dataset.i===q[2])x.classList.add(\"ok\");});\n          if(!ok)b.classList.add(\"no\");\n          setTimeout(function(){lock=false;qi++;draw();},window.SOreduced?150:650);\n        };\n      });\n    }\n    draw();\n  };\n})();\n<\/script>\n\n<!--CORE:END-->\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"logo\" href=\"#top\" aria-label=\"StudyOn — на главную\">STUDY<svg><use href=\"#i-on\"/><\/svg>N<\/a>\n    <nav class=\"nav\" aria-label=\"Разделы\">\n      <a href=\"#courses\">Курсы<\/a><a href=\"#club\">Talking Club<\/a><a href=\"#team\">Преподаватели<\/a><a href=\"#test\">Тест<\/a><a href=\"#reviews\">Отзывы<\/a><a href=\"#branches\">Филиалы<\/a>\n    <\/nav>\n    <div class=\"hd-r\">\n      <a class=\"tel\" href=\"tel:+996990313800\"><b>+996 990 31 38 00<\/b><small>Пн–Сб, 9:00–21:00<\/small><\/a>\n      <a class=\"ib wa\" data-wa href=\"#\" aria-label=\"Написать в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a>\n      <a class=\"ib gis\" data-gis href=\"#\" aria-label=\"Открыть в 2ГИС\"><svg><use href=\"#i-pin\"/><\/svg><\/a>\n      <a class=\"btn btn-y\" data-wa href=\"#\">Пробный урок<\/a>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<!-- 1. Первый экран: тумблер OFF → ON -->\n<section class=\"hero\" id=\"hero\" aria-labelledby=\"h1on\">\n  <div class=\"wrap hero-in\">\n    <div>\n      <span class=\"kick\"><svg><use href=\"#i-pin\"/><\/svg>Бишкек · Токмок · 7 лет · все уровни и IELTS<\/span>\n      <div class=\"h1w\">\n        <h1 class=\"off\" aria-hidden=\"true\">Понимаю.<br>Но молчу.<\/h1>\n        <h1 class=\"on\" id=\"h1on\">I speak<br>English!<\/h1>\n      <\/div>\n      <div class=\"sub\">\n        <span class=\"off\" aria-hidden=\"true\">Знакомо? Учили английский в школе, понимаете тексты — а заговорить страшно.<\/span>\n        <span class=\"on\">Включаем разговор с первого урока: 80% практики, 20% грамматики, группы до 10 человек.<\/span>\n      <\/div>\n      <div class=\"hero-cta\">\n        <a class=\"btn btn-main\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться на бесплатный урок<\/a>\n        <a class=\"btn btn-line\" href=\"#test\">Узнать свой уровень<\/a>\n      <\/div>\n      <div class=\"facts\">\n        <div><b>5000+<\/b><span>студентов<\/span><\/div>\n        <div><b>7 лет<\/b><span>учим говорить<\/span><\/div>\n        <div><b>до 10<\/b><span>человек в группе<\/span><\/div>\n        <div><b>3<\/b><span>филиала<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"sw\">\n      <button class=\"big\" id=\"bigSw\" role=\"switch\" aria-checked=\"false\" aria-label=\"Включить английский\">\n        <span class=\"lbl l-off\" aria-hidden=\"true\">OFF<\/span><span class=\"lbl l-on\" aria-hidden=\"true\">ON<\/span><span class=\"knob\"><\/span>\n      <\/button>\n      <span class=\"sw-cap\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Нажмите — включите английский<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- 2. Кружки-меню -->\n<nav class=\"hls\" aria-label=\"Быстрые разделы\">\n  <div class=\"wrap\"><ul>\n    <li><a href=\"#team\"><span class=\"hl\"><svg><use href=\"#i-person\"/><\/svg><\/span>Преподаватели<\/a><\/li>\n    <li><a href=\"#club\"><span class=\"hl\"><svg><use href=\"#i-chat\"/><\/svg><\/span>Talking Club<\/a><\/li>\n    <li><a href=\"#week\"><span class=\"hl\"><svg><use href=\"#i-cal\"/><\/svg><\/span>Будни<\/a><\/li>\n    <li><a href=\"#test\"><span class=\"hl\"><svg><use href=\"#i-q\"/><\/svg><\/span>Тест<\/a><\/li>\n    <li><a href=\"#reviews\"><span class=\"hl\"><svg><use href=\"#i-star\"/><\/svg><\/span>Отзывы<\/a><\/li>\n    <li><a href=\"#branches\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span>Асанбай<\/a><\/li>\n    <li><a href=\"#branches\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span>Филармония<\/a><\/li>\n    <li><a href=\"#branches\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span>Токмок<\/a><\/li>\n    <li><a href=\"#branches\"><span class=\"hl\"><svg><use href=\"#i-phone\"/><\/svg><\/span>Контакты<\/a><\/li>\n  <\/ul><\/div>\n<\/nav>\n\n<!-- 3. Методика 80/20 -->\n<section class=\"sec\" id=\"method\" aria-labelledby=\"h-method\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-chat\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-method\">Больше говорим, меньше зубрим<\/h2><p>Урок на 90% идёт на английском. Грамматику берём только ту, что нужна, чтобы говорить.<\/p><\/div><\/div>\n    <div class=\"mix\">\n      <div>\n        <div class=\"bar8\" role=\"img\" aria-label=\"80% урока — разговор, 20% — грамматика\">\n          <div class=\"sp\"><b>80%<\/b><small>разговор<\/small><\/div>\n          <div class=\"gr\"><b>20%<\/b><small>грамматика<\/small><\/div>\n        <\/div>\n        <p class=\"mix-note\">Без скучных учебников: темы урока подбираем под интересы группы — работа, путешествия, фильмы, переезд.<\/p>\n      <\/div>\n      <ul class=\"reasons\">\n        <li><span><svg><use href=\"#i-q\"/><\/svg><\/span><div><b>Находим слабые места<\/b><p>На первом уроке понимаем, что мешает говорить.<\/p><\/div><\/li>\n        <li><span><svg><use href=\"#i-book\"/><\/svg><\/span><div><b>Своя программа<\/b><p>Под вашу цель и срок — от 1 до 12 месяцев.<\/p><\/div><\/li>\n        <li><span><svg><use href=\"#i-users\"/><\/svg><\/span><div><b>Группы до 10 человек<\/b><p>Каждый говорит на каждом уроке.<\/p><\/div><\/li>\n        <li><span><svg><use href=\"#i-globe\"/><\/svg><\/span><div><b>Клубы с носителями<\/b><p>Практика на слух с иностранцами.<\/p><\/div><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- 4. Курсы -->\n<section class=\"sec paper\" id=\"courses\" aria-labelledby=\"h-courses\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-cap\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-courses\">Курсы<\/h2><p>Утренние и вечерние группы. Один уровень проходим за 2–3 месяца.<\/p><\/div><\/div>\n    <div class=\"courses\">\n      <article class=\"cc feat\">\n        <span class=\"ci\"><svg><use href=\"#i-chat\"/><\/svg><\/span><span class=\"who\">Взрослые, с нуля<\/span>\n        <h3>Разговорный английский<\/h3>\n        <p>Группа для взрослых: заговорите за 6 недель. Темы подбираем под интересы группы.<\/p>\n        <div class=\"pr\">от 4 500 сом<small>в месяц · 12 занятий<\/small><\/div>\n        <a class=\"more\" data-wa=\"Здравствуйте! Хочу на курс «Разговорный английский» в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a>\n      <\/article>\n      <article class=\"cc\">\n        <span class=\"ci\"><svg><use href=\"#i-kid\"/><\/svg><\/span><span class=\"who\">Дети 6–12 лет<\/span>\n        <h3>Английский для детей<\/h3>\n        <p>Игры, мультфильмы и актуальные темы. Ребёнок учится говорить без страха.<\/p>\n        <div class=\"pr\">от 4 000 сом<small>в месяц · 12 занятий<\/small><\/div>\n        <a class=\"more\" data-wa=\"Здравствуйте! Хочу записать ребёнка на английский в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записать ребёнка<\/a>\n      <\/article>\n      <article class=\"cc\">\n        <span class=\"ci\"><svg><use href=\"#i-trophy\"/><\/svg><\/span><span class=\"who\">Учёба и работа за рубежом<\/span>\n        <h3>Подготовка к IELTS<\/h3>\n        <p>Все 4 секции: Speaking, Writing, Reading, Listening. Пробный экзамен в конце.<\/p>\n        <div class=\"pr\">от 6 000 сом<small>в месяц<\/small><\/div>\n        <a class=\"more\" data-wa=\"Здравствуйте! Хочу на подготовку к IELTS в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a>\n      <\/article>\n      <article class=\"cc\">\n        <span class=\"ci\"><svg><use href=\"#i-one\"/><\/svg><\/span><span class=\"who\">Один на один<\/span>\n        <h3>Индивидуально<\/h3>\n        <p>С выбранным преподавателем, по вашим темам и графику. Можно интенсивом.<\/p>\n        <div class=\"pr\">от 800 сом<small>за занятие<\/small><\/div>\n        <a class=\"more\" data-wa=\"Здравствуйте! Хочу индивидуальные занятия английским в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Подобрать учителя<\/a>\n      <\/article>\n    <\/div>\n    <p class=\"note\">Цены — примерные, для макета. Первый урок — бесплатный.<\/p>\n  <\/div>\n<\/section>\n\n<!-- 5. Talking Club -->\n<section class=\"sec club on-dark\" id=\"club\" aria-labelledby=\"h-club\">\n  <div class=\"wrap club-g\">\n    <div>\n      <div class=\"sh\" style=\"margin-bottom:0\"><span class=\"hl\"><svg><use href=\"#i-globe\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-club\">Talking Club с носителем<\/h2><p>Раз в неделю — живой разговор с иностранцем. Без учебников, только практика на слух и речь.<\/p><\/div><\/div>\n      <ul>\n        <li><svg><use href=\"#i-check\"/><\/svg>Ведёт Мистер Рензе из Нидерландов<\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg>Для уровня Elementary и выше<\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg>Новая тема каждую встречу<\/li>\n      <\/ul>\n      <a class=\"btn btn-y\" data-wa=\"Здравствуйте! Хочу прийти в Talking Club StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Прийти в клуб<\/a>\n    <\/div>\n    <div class=\"chat\" id=\"chat\" aria-label=\"Пример разговора в клубе\">\n      <div class=\"msg\"><small>Renze<\/small>Hi everyone! Today's topic: your dream trip. Where would you go?<\/div>\n      <div class=\"msg me\"><small>Айпери<\/small>I'd go to Japan! I want to see Tokyo at night.<\/div>\n      <div class=\"msg\"><small>Renze<\/small>Nice! Why Tokyo and not Kyoto?<\/div>\n      <div class=\"msg me\"><small>Айпери<\/small>Hmm… because I love big cities. And anime, of course 😄<\/div>\n      <div class=\"msg\"><small>Renze<\/small>Great answer — you didn't stop once!<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- 6. Преподаватели -->\n<section class=\"sec\" id=\"team\" aria-labelledby=\"h-team\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-person\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-team\">Преподаватели<\/h2><p>Все учились за рубежом и знают культуру языка — объясняют так, что английский начинаешь понимать интуитивно.<\/p><\/div><\/div>\n    <div class=\"team\">\n      <article class=\"tc\">\n        <div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><span class=\"badge\">6 лет опыта<\/span><\/div>\n        <h3>Мисс Бибинур<\/h3><div class=\"spec\">Английский и китайский<\/div>\n        <p>Учитель двух иностранных языков. Ставит красивый британский акцент.<\/p>\n      <\/article>\n      <article class=\"tc\">\n        <div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><span class=\"badge\">Фильмы и песни<\/span><\/div>\n        <h3>Мистер Аман<\/h3><div class=\"spec\">Разговорный английский<\/div>\n        <p>Уроки через фильмы и песни. На его занятиях нужно быть активным.<\/p>\n      <\/article>\n      <article class=\"tc\">\n        <div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><span class=\"badge\">Южная Корея<\/span><\/div>\n        <h3>Мисс Виктория<\/h3><div class=\"spec\">Общий английский<\/div>\n        <p>Училась в Кванджу, преподавала в You &amp; I English Academy. Опыт 3+ года.<\/p>\n      <\/article>\n      <article class=\"tc\">\n        <div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><span class=\"badge\">Носитель · NL<\/span><\/div>\n        <h3>Мистер Рензе<\/h3><div class=\"spec\">Talking Club<\/div>\n        <p>Из Голландии, знает казахский. С ним прокачаете разговорный.<\/p>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- 7. Тест -->\n<section class=\"sec test\" id=\"test\" aria-labelledby=\"h-test\">\n  <div class=\"wrap test-g\">\n    <div class=\"test-side\">\n      <div class=\"sh\" style=\"margin-bottom:28px\"><span class=\"hl\"><svg><use href=\"#i-q\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-test\">Тест: какой у вас уровень?<\/h2><p>10 коротких вопросов, 3 минуты.<\/p><\/div><\/div>\n      <ul>\n        <li><svg><use href=\"#i-check\"/><\/svg>Сразу видите правильный ответ<\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg>В конце — уровень и подходящая группа<\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg>Результат можно отправить нам в WhatsApp<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"qbox\" id=\"quiz\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- 8. Будни: расписание, уровни, сезонные наборы -->\n<section class=\"sec\" id=\"week\" aria-labelledby=\"h-week\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-cal\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-week\">Будни StudyOn<\/h2><p>Работаем 6 дней в неделю с 9 утра до 9 вечера — выберите удобное время.<\/p><\/div><\/div>\n    <div class=\"week\">\n      <div class=\"days\">\n        <div class=\"days-h\" aria-label=\"Дни работы: понедельник — суббота\"><span>Пн<\/span><span>Вт<\/span><span>Ср<\/span><span>Чт<\/span><span>Пт<\/span><span>Сб<\/span><span class=\"off\">Вс<\/span><\/div>\n        <div class=\"slots\">\n          <div class=\"slot\"><span class=\"ti\"><svg><use href=\"#i-sun\"/><\/svg>9:00–12:00<\/span><p>Утренние группы — до работы или учёбы<\/p><a data-wa=\"Здравствуйте! Хочу в утреннюю группу StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Хочу утром<\/a><\/div>\n          <div class=\"slot\"><span class=\"ti\"><svg><use href=\"#i-kid\"/><\/svg>14:00–17:00<\/span><p>Детские группы — после школы<\/p><a data-wa=\"Здравствуйте! Хочу в детскую группу StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Для ребёнка<\/a><\/div>\n          <div class=\"slot\"><span class=\"ti\"><svg><use href=\"#i-moon\"/><\/svg>18:00–21:00<\/span><p>Вечерние группы — после работы<\/p><a data-wa=\"Здравствуйте! Хочу в вечернюю группу StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Хочу вечером<\/a><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"levels\">\n        <h3>4 уровня до свободной речи<\/h3>\n        <p>Каждый уровень — 2–3 месяца.<\/p>\n        <div class=\"lv\">\n          <div>Beginner <small>старт<\/small><\/div>\n          <div>Elementary <small>+2–3 мес<\/small><\/div>\n          <div>Pre-Intermediate <small>+2–3 мес<\/small><\/div>\n          <div>Intermediate <small>говорите свободно<\/small><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"seasons\">\n      <div class=\"ss now\"><span class=\"d\">17<small>ноября<\/small><\/span><div><b>Осенний набор<\/b><p>Новые группы Beginner и Elementary — места ещё есть.<\/p><\/div><\/div>\n      <div class=\"ss\"><span class=\"d\">12<small>января<\/small><\/span><div><b>Новый год — новый язык<\/b><p>Январский набор во все уровни и IELTS.<\/p><\/div><\/div>\n      <div class=\"ss\"><span class=\"d\">1<small>июня<\/small><\/span><div><b>Летний интенсив<\/b><p>Для школьников и студентов: 6 недель, каждый день.<\/p><\/div><\/div>\n    <\/div>\n    <p class=\"note\">Время групп и даты наборов — примерные, для макета.<\/p>\n  <\/div>\n<\/section>\n\n<!-- 9. Отзывы -->\n<section class=\"sec paper\" id=\"reviews\" aria-labelledby=\"h-rev\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-star\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-rev\">Было OFF — стало ON<\/h2><p>Что изменилось у наших студентов. Примеры отзывов — заменим на настоящие.<\/p><\/div><\/div>\n    <div class=\"revs\">\n      <article class=\"rv\">\n        <div class=\"was\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>Боялась открыть рот на собеседовании — всё понимала, но молчала.<\/p><\/div>\n        <div class=\"now\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>Через 3 месяца прошла интервью в международную компанию на английском.<\/p><\/div>\n        <div class=\"who\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Айжан, 26 лет<\/b><span>Pre-Intermediate, Асанбай<\/span><\/div><span class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/span><\/div>\n      <\/article>\n      <article class=\"rv\">\n        <div class=\"was\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>Сын не любил английский в школе, получал тройки.<\/p><\/div>\n        <div class=\"now\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>Теперь сам смотрит мультики на английском и просится на уроки.<\/p><\/div>\n        <div class=\"who\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Мама Эмира, 9 лет<\/b><span>Детская группа, Токмок<\/span><\/div><span class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/span><\/div>\n      <\/article>\n      <article class=\"rv\">\n        <div class=\"was\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>Два раза сдавал IELTS сам — 5.5, не хватало до магистратуры.<\/p><\/div>\n        <div class=\"now\"><svg class=\"tg\"><use href=\"#i-on\"/><\/svg><p>После курса — 7.0. Writing вырос на целый балл.<\/p><\/div>\n        <div class=\"who\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Бектур, 22 года<\/b><span>IELTS, Филармония<\/span><\/div><span class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/span><\/div>\n      <\/article>\n    <\/div>\n    <div class=\"rate\"><b>4,9<\/b><p>средняя оценка в 2ГИС<br>по отзывам студентов (для макета)<\/p><a class=\"btn btn-k\" data-gis href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>Все отзывы в 2ГИС<\/a><\/div>\n  <\/div>\n<\/section>\n\n<!-- 10. Филиалы и контакты -->\n<section class=\"sec club on-dark\" id=\"branches\" aria-labelledby=\"h-br\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-br\">Три филиала — выберите ближайший<\/h2><p>Пн–Сб, 9:00–21:00. Один номер для записи во все филиалы.<\/p><\/div><\/div>\n    <div class=\"br\">\n      <article class=\"bc\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span><h3>Асанбай<\/h3><p>Бишкек, ул. Арстанбека Дуйшеева, 6/4, ЖК «Park Avenue», район «Английский квартал»<\/p><div class=\"row\"><a class=\"btn btn-gis\" data-gis=\"asanbay\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу на пробный урок в филиал StudyOn на Асанбае\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a><\/div><\/article>\n      <article class=\"bc\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span><h3>Филармония<\/h3><p>Бишкек, проспект Манаса, 64/1 — ориентир: Филармония<\/p><div class=\"row\"><a class=\"btn btn-gis\" data-gis=\"filarm\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу на пробный урок в филиал StudyOn у Филармонии\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a><\/div><\/article>\n      <article class=\"bc\"><span class=\"hl\"><svg><use href=\"#i-pin\"/><\/svg><\/span><h3>Токмок<\/h3><p>Токмок, ул. Шамсинская, 44<\/p><div class=\"row\"><a class=\"btn btn-gis\" data-gis=\"tokmok\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу на пробный урок в филиал StudyOn в Токмоке\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a><\/div><\/article>\n    <\/div>\n    <div class=\"contact\">\n      <a class=\"big-tel\" href=\"tel:+996990313800\">+996 990 31 38 00<\/a>\n      <p>Звоните или пишите — подберём группу и время пробного урока.<\/p>\n      <a class=\"btn btn-wa\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>WhatsApp<\/a>\n      <a class=\"btn btn-k\" href=\"https://instagram.com/study_on_kg\" target=\"_blank\" rel=\"noopener\"><svg><use href=\"#i-ig\"/><\/svg>@study_on_kg<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer>\n  <div class=\"wrap ft\">\n    <a class=\"logo\" href=\"#top\">STUDY<svg><use href=\"#i-on\"/><\/svg>N<\/a>\n    <span>Курсы английского · Бишкек и Токмок · 7 лет опыта<\/span>\n    <a href=\"tel:+996990313800\">+996 990 31 38 00<\/a>\n  <\/div>\n<\/footer>\n\n<script>\n(function(){\n  /* тумблер на первом экране */\n  var hero=document.getElementById(\"hero\"), sw=document.getElementById(\"bigSw\"), touched=false;\n  function setOn(v){hero.classList.toggle(\"is-on\",v);sw.setAttribute(\"aria-checked\",v);sw.setAttribute(\"aria-label\",v?\"Выключить английский\":\"Включить английский\");}\n  sw.addEventListener(\"click\",function(){touched=true;setOn(!hero.classList.contains(\"is-on\"));});\n  setTimeout(function(){if(!touched)setOn(true);},window.SOreduced?0:1600);\n\n  /* переписка Talking Club появляется по одному сообщению, когда блок на экране */\n  var msgs=[].slice.call(document.querySelectorAll(\"#chat .msg\"));\n  function play(){msgs.forEach(function(m,i){setTimeout(function(){m.classList.add(\"in\");},window.SOreduced?0:i*900);});}\n  if(\"IntersectionObserver\" in window){\n    var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){play();io.disconnect();}},{threshold:.4});\n    io.observe(document.getElementById(\"chat\"));\n  } else play();\n\n  SOtest(document.getElementById(\"quiz\"));\n})();\n<\/script>\n<\/body>\n<\/html>\n", "v2-6nedel.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>StudyOn — разговорный английский за 6 недель<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap\">\n<style>\n/* ===== Вариант 2 «6 недель» — минимализм: белый фон, одна гарнитура Jost (геометрия как в логотипе),\n   чёрный текст и единственный акцент — жёлтый «маркер» StudyOn.\n   Анимация — путь из 6 недель: точка идёт по линии, фраза студента в облачке растёт с каждой неделей. ===== */\n:root{\n  --ink:#111;--muted:#6B6B66;--line:#E7E6E1;--tint:#FAFAF7;--y:#FFE000;\n  --f:\"Jost\",system-ui,\"Segoe UI\",sans-serif;\n  --mb-bg:#fff;--mb-fg:#111;--ph-bg:#F2F1EC;--ph-fg:#C8C6BC;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:80px}\nbody{margin:0;background:#fff;color:var(--ink);font:400 18px/1.6 var(--f);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\n.wrap{width:min(1140px,100% - 48px);margin-inline:auto}\n:focus-visible{outline:2px solid var(--ink);outline-offset:3px}\nh1,h2,h3{font-weight:400;margin:0;letter-spacing:-.02em}\nh2{font-size:clamp(32px,3.4vw,46px);line-height:1.1}\nh3{font-size:21px;font-weight:500;line-height:1.25}\np{margin:0}\n.mk{white-space:nowrap;background:linear-gradient(transparent 58%,var(--y) 58%,var(--y) 92%,transparent 92%);padding:0 .08em}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 26px;font:500 16px/1 var(--f);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,box-shadow .15s}\n.btn svg{width:19px;height:19px}\n.btn-k{background:var(--ink);color:#fff}\n.btn-k:hover{background:#333}\n.btn-line{box-shadow:inset 0 0 0 1px var(--line)}\n.btn-line:hover{box-shadow:inset 0 0 0 1px var(--ink)}\n.btn-wa svg{color:#25D366}\n\n/* раздел: слева значок + заголовок + пояснение, справа содержимое */\n.sec{padding:112px 0;border-top:1px solid var(--line)}\n.two{display:grid;grid-template-columns:330px 1fr;gap:64px;align-items:start}\n.lead{position:sticky;top:110px}\n.ic{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;margin-bottom:22px;position:relative}\n.ic svg{width:21px;height:21px}\n.ic::after{content:\"\";position:absolute;right:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--y)}\n.lead p{color:var(--muted);margin-top:16px;max-width:30ch}\n\n/* шапка */\nheader{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}\n.hd{display:flex;align-items:center;gap:34px;height:70px}\n.logo{display:flex;align-items:center;font:500 20px/1 var(--f);letter-spacing:.06em;text-decoration:none}\n.logo svg{width:32px;height:19px;margin:0 1px 0 2px}\n.nav{display:flex;gap:28px;font-size:16px}\n.nav a{text-decoration:none;color:var(--muted);white-space:nowrap}\n.nav a:hover{color:var(--ink)}\n.hd-r{margin-left:auto;display:flex;align-items:center;gap:18px}\n.tel{text-decoration:none;font-weight:500;white-space:nowrap;font-size:17px}\n.mini{display:flex;gap:6px}\n.mini a{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}\n.mini a:hover{box-shadow:inset 0 0 0 1px var(--ink)}\n.mini svg{width:19px;height:19px}\n.mini .wa svg{color:#25D366}.mini .gis svg{color:#2FB540}\n.hd .btn{padding:12px 20px;font-size:15px}\n\n/* первый экран */\n.hero{padding:84px 0 104px}\n.hero-g{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}\n.hero h1{font-size:clamp(46px,5.8vw,82px);line-height:1.02;font-weight:400;letter-spacing:-.035em}\n.hero .sub{color:var(--muted);font-size:20px;margin:26px 0 36px;max-width:40ch}\n.cta{display:flex;gap:12px;flex-wrap:wrap}\n.trust{display:flex;gap:36px;margin-top:48px;color:var(--muted);font-size:15px;flex-wrap:wrap}\n.trust b{display:block;color:var(--ink);font-weight:500;font-size:26px;line-height:1.1}\n\n/* анимация «6 недель» */\n.path{position:relative;padding:28px 6px 0}\n.bubble{position:relative;min-height:154px;display:flex;align-items:flex-end}\n.bubble div{position:relative;background:var(--tint);border:1px solid var(--line);border-radius:26px 26px 26px 6px;padding:20px 24px;font-size:clamp(20px,2vw,25px);line-height:1.3;max-width:100%;transition:opacity .3s}\n.bubble small{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}\n.bubble .caret{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}\n@keyframes blink{50%{opacity:0}}\n.track{position:relative;margin:38px 0 0;height:60px}\n.track .ln{position:absolute;left:0;right:0;top:12px;height:1px;background:var(--line)}\n.track .fill{position:absolute;left:0;top:11px;height:3px;background:var(--ink);width:0;transition:width .9s ease}\n.track ol{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;position:relative}\n.track li{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);width:24px}\n.track li i{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:background .3s,box-shadow .3s}\n.track li.done i{background:var(--ink);box-shadow:none}\n.track li.cur i{background:var(--y);box-shadow:inset 0 0 0 2px var(--ink)}\n.track li.cur{color:var(--ink);font-weight:500}\n.track li span{white-space:nowrap}\n.path-note{margin-top:14px;font-size:14.5px;color:var(--muted)}\n\n/* методика */\n.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}\n.stats div{padding:28px 24px 0 0}\n.stats b{display:block;font-size:clamp(46px,4.6vw,64px);font-weight:300;line-height:1;letter-spacing:-.04em}\n.stats p{color:var(--muted);margin-top:12px;font-size:16px;max-width:24ch}\n.list{list-style:none;margin:48px 0 0;padding:0}\n.list li{display:grid;grid-template-columns:28px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}\n.list li svg{width:20px;height:20px;margin-top:4px}\n\n/* подбор курса по цели */\n.goals{display:flex;flex-wrap:wrap;gap:10px}\n.goals button{border:0;border-radius:999px;padding:13px 20px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font:400 16.5px/1 var(--f);color:var(--ink);cursor:pointer}\n.goals button:hover{box-shadow:inset 0 0 0 1px var(--ink)}\n.goals button[aria-pressed=\"true\"]{background:var(--ink);color:#fff;box-shadow:none}\n.pick{margin-top:32px;border:1px solid var(--line);border-radius:28px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}\n.pick small{color:var(--muted);font-size:14px}\n.pick h3{font-size:30px;margin:4px 0 10px;font-weight:400;letter-spacing:-.02em}\n.pick p{color:var(--muted);max-width:52ch}\n.pick ul{list-style:none;margin:18px 0 0;padding:0;display:flex;gap:22px;flex-wrap:wrap;font-size:15.5px}\n.pick li{display:flex;gap:8px;align-items:center}\n.pick li svg{width:17px;height:17px}\n\n/* курсы и цены — строки */\n.rows{border-top:1px solid var(--ink)}\n.row{display:grid;grid-template-columns:1.2fr 1.4fr auto auto;gap:28px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line)}\n.row p{color:var(--muted);font-size:16px}\n.row .pr{font-size:22px;white-space:nowrap;text-align:right}\n.row .pr small{display:block;font-size:13px;color:var(--muted)}\n.row a{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}\n.row a:hover{background:var(--y);box-shadow:none}\n.row a svg{width:20px;height:20px}\n.note{font-size:14px;color:var(--muted);margin-top:20px}\n.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px;border-top:1px solid var(--line)}\n.hours div{padding:22px 20px 0 0}\n.hours b{display:block;font-weight:500;font-size:20px}\n.hours span{color:var(--muted);font-size:15.5px}\n\n/* команда — строки */\n.team{border-top:1px solid var(--ink)}\n.tm{display:grid;grid-template-columns:88px 1fr 1.3fr;gap:28px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}\n.tm .ph{width:88px;height:88px;border-radius:50%}\n.tm h3{font-size:22p l.querySelector(\".qt-again\").onclick=function(){qi=0;ans=[];draw();};\n        return;\n      }\n      var q=Q[qi];\n      el.innerHTML=prog+'<span class=\"qt-n\">Вопрос '+(qi+1)+' из '+n+' · вставьте пропущенное слово<\/span>'+\n        '<div class=\"qt-q\">'+q[0].replace(\"___\",\"<u>&nbsp;?&nbsp;<\/u>\")+'<\/div>'+\n        '<div class=\"qt-opts\">'+q[1].map(function(o,i){return '<button type=\"button\" data-i=\"'+i+'\">'+o+'<\/button>';}).join(\"\")+'<\/div>';\n      el.querySelectorAll(\".qt-opts button\").forEach(function(b){\n        b.onclick=function(){\n          if(lock)return; lock=true;\n          var ok=+b.dataset.i===q[2]; ans.push(ok);\n          el.querySelectorAll(\".qt-opts button\").forEach(function(x){x.disabled=true; if(+x.dataset.i===q[2])x.classList.add(\"ok\");});\n          if(!ok)b.classList.add(\"no\");\n          setTimeout(function(){lock=false;qi++;draw();},window.SOreduced?150:650);\n        };\n      });\n    }\n    draw();\n  };\n})();\n<\/script>\n\n<!--CORE:END-->\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"logo\" href=\"#top\" aria-label=\"StudyOn — на главную\">STUDY<svg><use href=\"#i-on\"/><\/svg>N<\/a>\n    <nav class=\"nav\" aria-label=\"Разделы\"><a href=\"#method\">Методика<\/a><a href=\"#pick\">Подбор курса<\/a><a href=\"#prices\">Цены<\/a><a href=\"#team\">Преподаватели<\/a><a href=\"#reviews\">Отзывы<\/a><a href=\"#branches\">Филиалы<\/a><\/nav>\n    <div class=\"hd-r\">\n      <a class=\"tel\" href=\"tel:+996990313800\">+996 990 31 38 00<\/a>\n      <div class=\"mini\"><a class=\"wa\" data-wa href=\"#\" aria-label=\"WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><a class=\"gis\" data-gis href=\"#\" aria-label=\"2ГИС\"><svg><use href=\"#i-pin\"/><\/svg><\/a><\/div>\n      <a class=\"btn btn-k\" data-wa href=\"#\">Пробный урок<\/a>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n<section class=\"hero\" aria-labelledby=\"h1\">\n  <div class=\"wrap hero-g\">\n    <div>\n      <h1 id=\"h1\">Разговорный английский за <span class=\"mk\">6 недель<\/span><\/h1>\n      <p class=\"sub\">80% урока — разговор, 20% — грамматика. Группы до 10 человек в Бишкеке и Токмоке. Первый урок бесплатно.<\/p>\n      <div class=\"cta\">\n        <a class=\"btn btn-k\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться на пробный урок<\/a>\n        <a class=\"btn btn-line\" href=\"tel:+996990313800\"><svg><use href=\"#i-phone\"/><\/svg>Позвонить<\/a>\n      <\/div>\n      <div class=\"trust\"><div><b>5000+<\/b>студентов<\/div><div><b>7 лет<\/b>опыта<\/div><div><b>3<\/b>филиала<\/div><\/div>\n    <\/div>\n    <div class=\"path\" aria-label=\"Как растёт речь за 6 недель\">\n      <div class=\"bubble\" aria-live=\"off\"><div><small id=\"pWho\">Неделя 1 · Асель<\/small><span id=\"pTxt\">Hi!<\/span><span class=\"caret\"><\/span><\/div><\/div>\n      <div class=\"track\">\n        <span class=\"ln\"><\/span><span class=\"fill\" id=\"pFill\"><\/span>\n        <ol id=\"pDots\">\n          <li><i><\/i><span><em>Нед. <\/em>1<\/span><\/li><li><i><\/i><span><em>Нед. <\/em>2<\/span><\/li><li><i><\/i><span><em>Нед. <\/em>3<\/span><\/li>\n          <li><i><\/i><span><em>Нед. <\/em>4<\/span><\/li><li><i><\/i><span><em>Нед. <\/em>5<\/span><\/li><li><i><\/i><span><em>Нед. <\/em>6<\/span><\/li>\n        <\/ol>\n      <\/div>\n      <p class=\"path-note\">Так растёт речь студента: от «Hi!» до рассказа о себе.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"method\" aria-labelledby=\"h-m\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-chat\"/><\/svg><\/span><h2 id=\"h-m\">Методика<\/h2><p>Говорите с первого урока. Грамматику даём ровно столько, сколько нужно для речи.<\/p><\/div>\n    <div>\n      <div class=\"stats\">\n        <div><b>80/20<\/b><p>разговор и грамматика на каждом уроке<\/p><\/div>\n        <div><b>90%<\/b><p>урока проходит на английском<\/p><\/div>\n        <div><b>≤10<\/b><p>человек в группе — говорит каждый<\/p><\/div>\n      <\/div>\n      <ul class=\"list\">\n        <li><svg><use href=\"#i-check\"/><\/svg><span>Без скучных учебников — только актуальные темы под интересы группы<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span>На первом уроке находим слабые и сильные стороны<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span>Программа под вашу цель и срок — от 1 до 12 месяцев<\/span><\/li>\n        <li><svg><use href=\"#i-check\"/><\/svg><span>Разговорные клубы с иностранцами и носителями языка<\/span><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"pick\" aria-labelledby=\"h-p\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-q\"/><\/svg><\/span><h2 id=\"h-p\">Зачем вам английский?<\/h2><p>Выберите цель — покажем подходящий курс и запишем на пробный урок.<\/p><\/div>\n    <div>\n      <div class=\"goals\" role=\"group\" aria-label=\"Цель\">\n        <button type=\"button\" data-g=\"0\" aria-pressed=\"true\">Для путешествий<\/button>\n        <button type=\"button\" data-g=\"1\" aria-pressed=\"false\">Для работы и карьеры<\/button>\n        <button type=\"button\" data-g=\"2\" aria-pressed=\"false\">Для поступления<\/button>\n        <button type=\"button\" data-g=\"3\" aria-pressed=\"false\">Сдать IELTS<\/button>\n        <button type=\"button\" data-g=\"4\" aria-pressed=\"false\">Работа за рубежом<\/button>\n        <button type=\"button\" data-g=\"5\" aria-pressed=\"false\">Для ребёнка<\/button>\n      <\/div>\n      <div class=\"pick\" aria-live=\"polite\">\n        <div><small>Вам подойдёт<\/small><h3 id=\"pkT\"><\/h3><p id=\"pkD\"><\/p><ul id=\"pkL\"><\/ul><\/div>\n        <a class=\"btn btn-k\" id=\"pkB\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записаться<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"prices\" aria-labelledby=\"h-c\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-tag\"/><\/svg><\/span><h2 id=\"h-c\">Курсы и цены<\/h2><p>Один уровень — 2–3 месяца. Для свободной речи — 4 уровня: от Beginner до Intermediate.<\/p><\/div>\n    <div>\n      <div class=\"rows\">\n        <div class=\"row\"><h3>Разговорный английский<\/h3><p>Группа для взрослых, с нуля и выше<\/p><div class=\"pr\">4 500 сом<small>в месяц<\/small><\/div><a data-wa=\"Здравствуйте! Хочу на «Разговорный английский» в StudyOn\" href=\"#\" aria-label=\"Записаться в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><\/div>\n        <div class=\"row\"><h3>Английский для детей<\/h3><p>6–12 лет: игры, мультфильмы, живые темы<\/p><div class=\"pr\">4 000 сом<small>в месяц<\/small><\/div><a data-wa=\"Здравствуйте! Хочу записать ребёнка в StudyOn\" href=\"#\" aria-label=\"Записаться в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><\/div>\n        <div class=\"row\"><h3>Подготовка к IELTS<\/h3><p>Speaking, Writing, Reading, Listening<\/p><div class=\"pr\">6 000 сом<small>в месяц<\/small><\/div><a data-wa=\"Здравствуйте! Хочу на подготовку к IELTS в StudyOn\" href=\"#\" aria-label=\"Записаться в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><\/div>\n        <div class=\"row\"><h3>Индивидуально<\/h3><p>Один на один с выбранным учителем<\/p><div class=\"pr\">800 сом<small>за занятие<\/small><\/div><a data-wa=\"Здравствуйте! Хочу индивидуальные занятия в StudyOn\" href=\"#\" aria-label=\"Записаться в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><\/div>\n        <div class=\"row\"><h3>Для компаний<\/h3><p>Корпоративное обучение в офисе или онлайн<\/p><div class=\"pr\">по запросу<small>&nbsp;<\/small><\/div><a data-wa=\"Здравствуйте! Интересует корпоративное обучение английскому в StudyOn\" href=\"#\" aria-label=\"Написать в WhatsApp\"><svg><use href=\"#i-wa\"/><\/svg><\/a><\/div>\n      <\/div>\n      <p class=\"note\">Цены примерные, для макета. Пробный урок — бесплатно.<\/p>\n      <div class=\"hours\">\n        <div><b>Утро<\/b><span>9:00–12:00, до работы<\/span><\/div>\n        <div><b>День<\/b><span>14:00–17:00, дети после школы<\/span><\/div>\n        <div><b>Вечер<\/b><span>18:00–21:00, после работы<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"team\" aria-labelledby=\"h-t\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-person\"/><\/svg><\/span><h2 id=\"h-t\">Преподаватели<\/h2><p>Все учились за рубежом и знают культуру языка.<\/p><\/div>\n    <div class=\"team\">\n      <div class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><h3>Мисс Бибинур<\/h3><div class=\"spec\">Английский и китайский · 6 лет<\/div><\/div><p>Поставит красивый британский акцент.<\/p><\/div>\n      <div class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><h3>Мистер Аман<\/h3><div class=\"spec\">Разговорный английский<\/div><\/div><p>Учит через фильмы и песни — каждый урок живой.<\/p><\/div>\n      <div class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><h3>Мисс Виктория<\/h3><div class=\"spec\">Общий английский · 3+ года<\/div><\/div><p>Училась в Южной Корее, преподавала в You &amp; I English Academy.<\/p><\/div>\n      <div class=\"tm\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><h3>Мистер Рензе<\/h3><div class=\"spec\">Носитель · Talking Club<\/div><\/div><p>Из Нидерландов. Ведёт разговорный клуб.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"reviews\" aria-labelledby=\"h-r\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-star\"/><\/svg><\/span><h2 id=\"h-r\">Отзывы<\/h2><p>Примеры — заменим на настоящие отзывы студентов.<\/p><\/div>\n    <div>\n      <p class=\"quote\">«Пять лет учила английский в школе и молчала. Здесь на втором уроке уже спорила с Аманом о фильмах — и даже не заметила, что говорю по-английски.»<\/p>\n      <div class=\"qwho\"><div class=\"ph\"><svg class=\"ph-i\"><use href=\"#i-person\"/><\/svg><\/div><div><b>Асель, 24 года<\/b><span>Разговорный английский, Асанбай<\/span><\/div><\/div>\n      <div class=\"small-q\">\n        <div><div class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><p>Сдал IELTS на 7.0 с первого раза. Writing разбирали по каждому эссе.<\/p><span>Бектур · IELTS, Филармония<\/span><\/div>\n        <div><div class=\"stars\"><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><svg><use href=\"#i-star\"/><\/svg><\/div><p>Дочь ходит с радостью, дома поёт песни на английском.<\/p><span>Мама Сафии, 8 лет · Токмок<\/span><\/div>\n      <\/div>\n      <div class=\"rate\"><b>4,9<\/b><p>средняя оценка в 2ГИС (для макета)<\/p><a class=\"btn btn-line\" data-gis href=\"#\"><svg style=\"color:#2FB540\"><use href=\"#i-pin\"/><\/svg>Отзывы в 2ГИС<\/a><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"faq\" aria-labelledby=\"h-f\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-q\"/><\/svg><\/span><h2 id=\"h-f\">Вопросы<\/h2><p>Не нашли ответ — напишите, ответим в WhatsApp.<\/p><\/div>\n    <div>\n      <details><summary>Я совсем не знаю английский. Мне можно?<i><\/i><\/summary><p>Да. Есть группы Beginner — с нуля. На пробном уроке определим уровень и подберём группу.<\/p><\/details>\n      <details><summary>Правда ли можно заговорить за 6 недель?<i><\/i><\/summary><p>За 6 недель вы начнёте говорить на простые темы: о себе, работе, путешествиях. Для свободной речи нужно пройти 4 уровня — каждый 2–3 месяца.<\/p><\/details>\n      <details><summary>Сколько стоит пробный урок?<i><\/i><\/summary><p>Пробный урок бесплатный. Запишитесь в WhatsApp или по телефону +996 990 31 38 00.<\/p><\/details>\n      <details><summary>С какого возраста берёте детей?<i><\/i><\/summary><p>Детские группы — от 6 до 12 лет. Подростков с 13 лет берём во взрослые группы по уровню.<\/p><\/details>\n      <details><summary>Можно перейти в другой филиал?<i><\/i><\/summary><p>Да, у нас 3 филиала — Асанбай, Филармония и Токмок. Переведём в группу вашего уровня.<\/p><\/details>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"branches\" aria-labelledby=\"h-b\">\n  <div class=\"wrap two\">\n    <div class=\"lead\"><span class=\"ic\"><svg><use href=\"#i-pin\"/><\/svg><\/span><h2 id=\"h-b\">Филиалы<\/h2><p>Пн–Сб, 9:00–21:00.<\/p><\/div>\n    <div>\n      <div class=\"br\">\n        <div class=\"b\"><h3>Асанбай<\/h3><p>Бишкек, ул. Арстанбека Дуйшеева, 6/4, ЖК «Park Avenue»<\/p><div class=\"acts\"><a class=\"btn btn-line\" data-gis=\"asanbay\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><\/div><\/div>\n        <div class=\"b\"><h3>Филармония<\/h3><p>Бишкек, проспект Манаса, 64/1<\/p><div class=\"acts\"><a class=\"btn btn-line\" data-gis=\"filarm\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><\/div><\/div>\n        <div class=\"b\"><h3>Токмок<\/h3><p>ул. Шамсинская, 44<\/p><div class=\"acts\"><a class=\"btn btn-line\" data-gis=\"tokmok\" href=\"#\"><svg><use href=\"#i-pin\"/><\/svg>2ГИС<\/a><\/div><\/div>\n      <\/div>\n      <div class=\"final\">\n        <a class=\"big\" href=\"tel:+996990313800\">+996 990 31 38 00<\/a>\n        <a class=\"btn btn-k\" data-wa href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Написать в WhatsApp<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer><div class=\"wrap ft\"><span>StudyOn · курсы английского · Бишкек и Токмок<\/span><a href=\"https://instagram.com/study_on_kg\" target=\"_blank\" rel=\"noopener\">@study_on_kg<\/a><\/div><\/footer>\n\n<script>\n(function(){\n  /* путь «6 недель»: точка идёт по линии, фраза растёт */\n  var W=[\n    \"Hi!\",\n    \"Hi, I'm Asel. I'm from Bishkek.\",\n    \"I work in a bank. I like my job.\",\n    \"Can I get a latte, please? No sugar.\",\n    \"Last summer I went to Issyk-Kul with friends.\",\n    \"I'd love to work abroad one day — maybe in Canada. What about you?\"\n  ];\n  var txt=document.getElementById(\"pTxt\"), who=document.getElementById(\"pWho\"), fill=document.getElementById(\"pFill\"),\n      dots=[].slice.call(document.querySelectorAll(\"#pDots li\")), wk=0, timer;\n  function type(s,cb){\n    if(window.SOreduced){txt.textContent=s;return cb&&setTimeout(cb,2600);}\n    var i=0; txt.textContent=\"\";\n    (function step(){txt.textContent=s.slice(0,++i); if(i<s.length)timer=setTimeout(step,38); else timer=setTimeout(cb,1700);})();\n  }\n  function show(){\n    who.textContent=\"Неделя \"+(wk+1)+\" · Асель\";\n    dots.forEach(function(d,i){d.className=i<wk?\"done\":(i===wk?\"cur\":\"\");});\n    fill.style.width=(wk/5*100)+\"%\";\n    type(W[wk],function(){wk=(wk+1)%6;show();});\n  }\n  show();\n\n  /* подбор курса по цели */\n  var G=[\n    {t:\"Разговорный английский\",d:\"Говорите в путешествиях: аэропорт, отель, кафе, знакомства. Заговорите за 6 недель.\",l:[\"Группа до 10 человек\",\"Утро или вечер\",\"Talking Club с носителем\"]},\n    {t:\"Разговорный + деловой английский\",d:\"Собеседования, переписка, встречи. Темы подбираем под вашу профессию.\",l:[\"Вечерние группы\",\"Индивидуально — по вашему графику\",\"Корпоративно — для команды\"]},\n    {t:\"Английский для поступления\",d:\"Грамматика, письмо и устная часть для вступительных и магистратуры.\",l:[\"Программа под срок поступления\",\"Пробные экзамены\",\"Индивидуально или в группе\"]},\n    {t:\"Подготовка к IELTS\",d:\"Все 4 секции: Speaking, Writing, Reading, Listening. Разбор каждого эссе.\",l:[\"Пробный IELTS в конце курса\",\"Стратегии по каждой секции\",\"Группа или один на один\"]},\n    {t:\"Интенсив для работы за рубежом\",d:\"Бытовой и рабочий английский для переезда: от документов до общения с коллегами.\",l:[\"Интенсив от 1 месяца\",\"Talking Club с носителем\",\"Индивидуальная программа\"]},\n    {t:\"Английский для детей 6–12 лет\",d:\"Игры, мультфильмы и песни. Ребёнок учится говорить без страха ошибиться.\",l:[\"Группы после школы\",\"Мини-группы по возрасту\",\"Отчёт родителям\"]}\n  ];\n  var bs=[].slice.call(document.querySelectorAll(\".goals button\"));\n  function pick(i){\n    var g=G[i];\n    bs.forEach(function(b){b.setAttribute(\"aria-pressed\",+b.dataset.g===i);});\n    document.getElementById(\"pkT\").textContent=g.t;\n    document.getElementById(\"pkD\").textContent=g.d;\n    document.getElementById(\"pkL\").innerHTML=g.l.map(function(x){return '<li><svg><use href=\"#i-check\"/><\/svg>'+x+'<\/li>';}).join(\"\");\n    var b=document.getElementById(\"pkB\"); b.dataset.wa=\"Здравствуйте! Хочу на курс «\"+g.t+\"» в StudyOn. Запишите, пожалуйста, на пробный урок.\"; SOwa();\n  }\n  bs.forEach(function(b){b.onclick=function(){pick(+b.dataset.g);};});\n  pick(0);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "v3-govorim.html": "<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>StudyOn — говорим по-английски<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@400;600;700;800;900&display=swap\">\n<style>\n/* ===== Вариант 3 «Говорим!» — яркий, для школьников, студентов и родителей.\n   Жёлтый StudyOn + чёрные толстые рамки, жёсткие тени и наклеенные стикеры (розовый, голубой).\n   Фишки: карточка «Скажи по-английски» (переворачивается), бегущая строка, живая шкала «Сейчас в StudyOn»\n   по времени Бишкека, обратный отсчёт до набора, учителя-перевёртыши, тест на 10 вопросов. ===== */\n:root{\n  --y:#FFE000;--k:#000;--pink:#FF8AC4;--sky:#8FD8FF;--mint:#9BF0B9;--paper:#FFFBE3;--muted:#4A4636;\n  --h:\"Rubik Mono One\",system-ui,sans-serif;--b:\"Nunito\",system-ui,\"Segoe UI\",sans-serif;\n  --mb-bg:#FFE000;--mb-fg:#000;--ph-bg:#fff;--ph-fg:#D8D2AE;\n  --bd:3px solid #000;--sh:6px 6px 0 #000;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:86px}\nbody{margin:0;background:var(--paper);color:#000;font:600 17px/1.55 var(--b);-webkit-font-smoothing:antialiased}\na{color:inherit}\nsvg{display:block}\n.wrap{width:min(1180px,100% - 48px);margin-inline:auto}\n:focus-visible{outline:3px dashed #000;outline-offset:4px}\nh1,h2,h3{margin:0;font-weight:400;line-height:1.08}\nh1,h2{font-family:var(--h);letter-spacing:-.01em}\nh2{font-size:clamp(26px,3vw,40px)}\nh3{font:900 22px/1.2 var(--b)}\np{margin:0}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:var(--bd);border-radius:16px;padding:14px 22px;font:900 16px/1 var(--b);text-decoration:none;cursor:pointer;white-space:nowrap;box-shadow:4px 4px 0 #000;transition:transform .12s,box-shadow .12s;color:#000;background:#fff}\n.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}\n.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}\n.btn svg{width:20px;height:20px}\n.btn-k{background:#000;color:var(--y)}\n.btn-y{background:var(--y)}\n.btn-wa{background:#25D366;color:#fff}\n.btn-gis{background:#2FB540;color:#fff}\n\n/* заголовок раздела: цветной стикер со значком, наклонён */\n.sec{padding:108px 0}\n.sh{display:flex;gap:22px;align-items:center;margin-bottom:52px;flex-wrap:wrap}\n.stk{flex:0 0 auto;width:70px;height:70px;border:var(--bd);border-radius:20px;display:grid;place-items:center;box-shadow:4px 4px 0 #000;transform:rotate(-6deg);background:var(--y)}\n.stk svg{width:32px;height:32px}\n.stk.pink{background:var(--pink)}.stk.sky{background:var(--sky)}.stk.mint{background:var(--mint)}.stk.w{background:#fff}\n.sh .t{flex:1;min-width:260px}\n.sh p{margin-top:10px;color:var(--muted);max-width:56ch;font-weight:600}\n\n/* шапка */\nheader{position:sticky;top:0;z-index:50;background:var(--y);border-bottom:var(--bd)}\n.hd{display:flex;align-items:center;gap:26px;height:74px}\n.logo{display:flex;align-items:center;font:400 21px/1 var(--h);text-decoration:none;background:#000;color:#fff;padding:9px 13px;border-radius:12px}\n.logo svg{width:34px;height:20px;color:var(--y);margin:0 2px}\n.nav{display:flex;gap:20px;font-weight:800;font-size:15.5px}\n.nav a{text-decoration:none}\n.nav a:hover{text-decoration:underline 3px}\n.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}\n.tel{font-weight:900;font-size:18px;text-decoration:none;white-space:nowrap;padding:0 6px}\n.ib{width:46px;height:46px;border:var(--bd);border-radius:14px;display:grid;place-items:center;box-shadow:3px 3px 0 #000}\n.ib svg{width:22px;height:22px}\n.ib.wa{background:#25D366;color:#fff}.ib.gis{background:#2FB540;color:#fff}\n.hd .btn{padding:12px 18px;font-size:15px}\n\n/* первый экран */\n.hero{background:var(--y);border-bottom:var(--bd);overflow:hidden}\n.hero-g{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:48px;align-items:center;padding:64px 0 76px}\n.hero h1{font-size:clamp(34px,3.9vw,54px);line-height:1.08}\n.hero .sub{font-size:20px;margin:24px 0 32px;max-width:42ch}\n.cta{display:flex;gap:14px;flex-wrap:wrap}\n.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}\n.tags span{border:var(--bd);border-radius:999px;padding:7px 14px;background:#fff;font-weight:800;font-size:14.5px}\n.tags span:nth-child(2){background:var(--pink)}.tags span:nth-child(3){background:var(--sky)}.tags span:nth-child(4){background:var(--mint)}\n\n/* карточка «Скажи по-английски» */\n.say{position:relative;justify-self:center;width:100%;max-width:440px}\n.say .lbl{position:absolute;top:-18px;left:22px;z-index:3;background:#000;color:var(--y);font:400 14px/1 var(--h);padding:10px 14px;border-radius:12px;transform:rotate(-3deg)}\n.card{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%;display:block;font:inherit;color:inherit;text-align:left}\n.card-in{display:block;position:relative;height:290px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}\n.card.flip .card-in{transform:rotateY(180deg)}\n.face{position:absolute;inset:0;backface-visibility:hidden;border:var(--bd);border-radius:28px;box-shadow:10px 10px 0 #000;padding:42px 30px 26px;display:flex;flex-direction:column}\n.face.ru{background:#fff}\n.face.en{background:var(--pink);transform:rotateY(180deg)}\n.face small{font-weight:800;font-size:14px;color:var(--muted)}\n.face.en small{color:#000}\n.face b{font:900 clamp(26px,2.6vw,34px)/1.15 var(--b);margin-top:12px;flex:1}\n.face .hint{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px}\n.face .hint svg{width:20px;height:20px}\n.say-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px}\n.say-nav .dots{display:flex;gap:6px}\n.say-nav .dots i{width:12px;height:12px;border:2px solid #000;border-radius:50%}\n.say-nav .dots i.on{background:#000}\n.say-nav button{border:var(--bd);background:#fff;border-radius:12px;padding:9px 14px;font:900 14.5px var(--b);cursor:pointer;box-shadow:3px 3px 0 #000}\n.star-b{position:absolute;right:-18px;top:-30px;width:86px;height:86px;color:var(--sky);animation:spin 14s linear infinite;z-index:2}\n.star-b path{stroke:#000;stroke-width:3}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n/* бегущая строка */\n.ticker{background:#000;color:var(--y);overflow:hidden;border-bottom:var(--bd);white-space:nowrap}\n.ticker div{display:inline-flex;gap:40px;padding:16px 0;font:400 20px/1 var(--h);animation:run 30s linear infinite}\n.ticker span{display:inline-flex;align-items:center;gap:40px}\n.ticker span::after{content:\"✦\";color:var(--pink)}\n@keyframes run{to{transform:translateX(-50%)}}\n\n/* сейчас в StudyOn */\n.now{background:#fff;border:var(--bd);border-radius:30px;box-shadow:var(--sh);padding:32px}\n.now-top{display:flex;align-items:center;g \",\"has sent\",\"is sending\"],1],\n    [\"If I ___ you, I would take this job.\",[\"am\",\"was being\",\"were\",\"will be\"],2],\n    [\"I wish I ___ more time last year.\",[\"have\",\"had\",\"had had\",\"would have\"],2]\n  ];\n  var LV=[\n    {n:\"Beginner\",t:\"Начнём с нуля: группа Beginner, утром или вечером. Через 2–3 месяца — следующий уровень.\"},\n    {n:\"Elementary\",t:\"Подойдёт группа Elementary. Уже можно ходить в Talking Club — слушать и отвечать короткими фразами.\"},\n    {n:\"Pre-Intermediate\",t:\"Подойдёт группа Pre-Intermediate и Talking Club с носителем раз в неделю — чтобы заговорить свободнее.\"},\n    {n:\"Intermediate\",t:\"Вы уже говорите. Дальше — группа Intermediate или курс «Разговорный английский за 6 недель».\"},\n    {n:\"Upper-Intermediate+\",t:\"Сильный уровень. Рекомендуем подготовку к IELTS по всем 4 секциям или индивидуальные занятия.\"}\n  ];\n  var MAP=[0,0,0,1,1,2,2,3,3,4,4];\n  window.SOtest=function(el){\n    var qi=0, ans=[], lock=false, n=Q.length;\n    el.classList.add(\"qt\");\n    function draw(){\n      var prog='<div class=\"qt-prog\">'+Q.map(function(_,i){return '<i class=\"'+(i<=qi?\"on\":\"\")+'\"><\/i>';}).join(\"\")+'<\/div>';\n      if(qi>=n){\n        var sc=ans.filter(Boolean).length, r=LV[MAP[sc]];\n        var wa=\"Здравствуйте! Прошёл(а) тест на сайте StudyOn: \"+sc+\" из 10, уровень \"+r.n+\". Хочу записаться на бесплатный пробный урок.\";\n        el.innerHTML=prog+'<div class=\"qt-res\" aria-live=\"polite\"><span class=\"qt-n\">Ваш примерный уровень<\/span>'+\n          '<div class=\"qt-lvl\">'+r.n+'<\/div>'+\n          '<div class=\"qt-dots\" role=\"img\" aria-label=\"'+sc+' из 10\">'+ans.map(function(a){return '<i class=\"'+(a?\"ok\":\"\")+'\"><\/i>';}).join(\"\")+'<\/div>'+\n          '<p><b>Правильных ответов: '+sc+' из 10. <\/b>'+r.t+'<\/p>'+\n          '<div class=\"qt-next\"><b>Что дальше? Отправьте результат — подберём группу и запишем на бесплатный пробный урок.<\/b>'+\n          '<div class=\"qt-btns\"><a class=\"qt-wa\" target=\"_blank\" rel=\"noopener\" href=\"'+window.SOwaLink(wa)+'\"><svg><use href=\"#i-wa\"/><\/svg>Отправить в WhatsApp<\/a>'+\n          '<a class=\"qt-call\" href=\"tel:+996990313800\"><svg><use href=\"#i-phone\"/><\/svg>Позвонить<\/a>'+\n          '<button class=\"qt-again\" type=\"button\">Пройти заново<\/button><\/div><\/div><\/div>';\n        el.querySelector(\".qt-again\").onclick=function(){qi=0;ans=[];draw();};\n        return;\n      }\n      var q=Q[qi];\n      el.innerHTML=prog+'<span class=\"qt-n\">Вопрос '+(qi+1)+' из '+n+' · вставьте пропущенное слово<\/span>'+\n        '<div class=\"qt-q\">'+q[0].replace(\"___\",\"<u>&nbsp;?&nbsp;<\/u>\")+'<\/div>'+\n        '<div class=\"qt-opts\">'+q[1].map(function(o,i){return '<button type=\"button\" data-i=\"'+i+'\">'+o+'<\/button>';}).join(\"\")+'<\/div>';\n      el.querySelectorAll(\".qt-opts button\").forEach(function(b){\n        b.onclick=function(){\n          if(lock)return; lock=true;\n          var ok=+b.dataset.i===q[2]; ans.push(ok);\n          el.querySelectorAll(\".qt-opts button\").forEach(function(x){x.disabled=true; if(+x.dataset.i===q[2])x.classList.add(\"ok\");});\n          if(!ok)b.classList.add(\"no\");\n          setTimeout(function(){lock=false;qi++;draw();},window.SOreduced?150:650);\n        };\n      });\n    }\n    draw();\n  };\n})();\n<\/script>\n\n<!--CORE:END-->\n\n<header>\n  <div class=\"wrap hd\">\n    <a class=\"logo\" href=\"#top\" aria-label=\"StudyOn — на главную\">STUDY<svg><use href=\"#i-on\"/><\/svg>N<\/a>\n    <nav class=\"nav\" aria-label=\"Разделы\"><a href=\"#now\">Сейчас<\/a><a href=\"#courses\">Курсы<\/a><a href=\"#test\">Тест<\/a><a href=\"#sets\">Наборы<\/a><a href=\"#team\">Учителя<\/a><a href=\"#reviews\">Отзывы<\/a><a href=\"#branches\">Филиалы<\/a><\/nav>\n    <div class=\"hd-r\">\n      <a class=\"tel\" href=\"tel:+996990313800\">+996 990 31 38 00<\/a>\n      <a class=\"ib wa\" data-wa href=\"#\" aria-label=\"WhatsApp\"><svg>< dden=\"true\"><div id=\"tick\"><\/div><\/div>\n\n<!-- Сейчас в StudyOn -->\n<section class=\"sec\" id=\"now\" aria-labelledby=\"h-now\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"stk\"><svg><use href=\"#i-clock\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-now\">Сейчас в StudyOn<\/h2><p>Что идёт прямо сейчас по времени Бишкека. Пн–Сб, 9:00–21:00 — выбирайте удобное время.<\/p><\/div><\/div>\n    <div class=\"now\">\n      <div class=\"now-top\"><div class=\"clock\" id=\"clk\">--:--<\/div><div class=\"now-st\"><b><i id=\"dot\"><\/i><span id=\"stT\"><\/span><\/b><p id=\"stP\"><\/p><\/div><a class=\"btn btn-wa\" data-wa=\"Здравствуйте! Хочу подобрать время для группы в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Подобрать время<\/a><\/div>\n      <div class=\"tl\" id=\"tl\"><\/div>\n    <\/div>\n    <p class=\"note\">Расписание групп — примерное, для макета.<\/p>\n  <\/div>\n<\/section>\n\n<!-- Курсы -->\n<section class=\"sec\" id=\"courses\" aria-labelledby=\"h-c\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sh\"><span class=\"stk pink\"><svg><use href=\"#i-cap\"/><\/svg><\/span><div class=\"t\"><h2 id=\"h-c\">Курсы<\/h2><p>80% разговора, 20% грамматики. Группы до 10 человек.<\/p><\/div><\/div>\n    <div class=\"courses\">\n      <article class=\"cc\"><span class=\"ci\"><svg><use href=\"#i-kid\"/><\/svg><\/span><h3>Для детей 6–12<\/h3><p>Игры, мультфильмы, песни. Говорят без страха ошибиться.<\/p><div class=\"pr\">от 4 000<small>сом в месяц<\/small><\/div><a class=\"btn\" data-wa=\"Здравствуйте! Хочу записать ребёнка в StudyOn\" href=\"#\"><svg><use href=\"#i-wa\"/><\/svg>Записать<\/a><\/article>\n      <article class=\"cc\"><span class=\"ci\"><svg><use href=\"#i-chat\"/><\/svg><\/span><h3>Разговорный<\/h3><p>Для подростков 13+ и взрослых. Заговорите за 6 недель.<\/p><div class=\"pr\">от 4 500<small>сом в месяц<\/small><\/div><a class=\"btn\" data-wa=\"Здравствуйте! Хочу на разговорный английский в StudyOn\" href=\"#
