<style>
.mbar{display:none}
.ph{position:relative;overflow:hidden;background:var(--ph-bg,#f1efe6);color:var(--ph-fg,#b9b39a)}
.ph>svg.ph-i{position:absolute;left:50%;bottom:-6%;width:78%;height:78%;transform:translateX(-50%);opacity:.55}
@media (max-width:760px){
  body{padding-bottom:78px}
  .mbar{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--mb-bg,#fff);box-shadow:0 -8px 24px rgba(0,0,0,.14)}
  .mbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;padding:8px 4px;font:700 12px/1.2 system-ui,sans-serif;text-decoration:none;color:var(--mb-fg,#222);background:rgba(127,127,127,.15)}
  .mbar svg{width:22px;height:22px}
  .mbar a.wa{background:#25D366;color:#fff;font-size:13px}
  .mbar a.gis{background:#2FB540;color:#fff}
}
/* ===== Тест уровня (10 вопросов) — общий для вариантов 1 и 3.
   Цвета задаёт вариант через переменные на контейнере:
   --qa акцент, --qopt фон ответа, --qh шрифт заголовков, --qtrack пустые полоски,
   --qnext фон блока «что дальше», --qcall/--qcallfg кнопка «Позвонить», --qr скругление */
.qt{display:flex;flex-direction:column}
.qt-prog{display:flex;gap:5px;margin-bottom:18px}
.qt-prog i{flex:1;height:6px;border-radius:6px;background:var(--qtrack,rgba(127,127,127,.2))}
.qt-prog i.on{background:var(--qa,#000)}
.qt-n{font-size:14px;font-weight:600;opacity:.7}
.qt-q{font-family:var(--qh,inherit);font-weight:700;font-size:clamp(21px,2.3vw,28px);line-height:1.3;margin:8px 0 20px}
.qt-q u{text-decoration:none;border-bottom:3px dotted var(--qa,#000);padding:0 8px}
.qt-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qt-opts button{border:0;background:var(--qopt,#fff);color:inherit;border-radius:var(--qr,16px);padding:15px 18px;text-align:left;font-family:inherit;font-weight:600;font-size:16.5px;line-height:1.2;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.qt-opts button:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--qa,#000)}
.qt-opts button.ok{background:#1FA36B;color:#fff}
.qt-opts button.no{background:#E5484D;color:#fff}
.qt-opts button:disabled{cursor:default}
.qt-lvl{font-family:var(--qh,inherit);font-weight:800;font-size:clamp(32px,3.8vw,46px);line-height:1.05;color:var(--qa,#000);margin:6px 0 10px}
.qt-dots{display:flex;gap:4px;margin:2px 0 14px}
.qt-dots i{width:16px;height:8px;border-radius:4px;background:#E5484D;opacity:.75}
.qt-dots i.ok{background:#1FA36B;opacity:1}
.qt-res p{margin:0 0 16px}
.qt-next{background:var(--qnext,rgba(127,127,127,.1));border-radius:var(--qr,16px);padding:16px 18px}
.qt-next b{display:block;margin-bottom:12px}
.qt-btns{display:flex;gap:8px;flex-wrap:wrap}
.qt-btns a,.qt-btns button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--qr,16px);padding:13px 18px;font-family:inherit;font-weight:700;font-size:15px;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}
.qt-btns svg{width:18px;height:18px}
.qt-wa{background:#25D366;color:#fff}
.qt-call{background:var(--qcall,var(--qa,#000));color:var(--qcallfg,#fff)}
.qt-btns .qt-again{background:none;color:inherit;text-decoration:underline;opacity:.75;padding:13px 6px}
@media (max-width:760px){.qt-opts{grid-template-columns:1fr}.qt-btns a{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
/* ===== Ссылки WhatsApp и 2ГИС =====
   <a data-wa="готовый текст"> — номер и сообщение подставляются сами (пусто — текст по умолчанию).
   <a data-gis> — 2ГИС центра; data-gis="asanbay" | "filarm" | "tokmok" — конкретный филиал. */
(function(){
  var WA = "https://wa.me/996990313800?text=";
  var WA_DEF = "Здравствуйте! Хочу записаться на бесплатный пробный урок в StudyOn";
  var GIS = {
    "":       "https://2gis.kg/bishkek/search/StudyOn%20%D0%BA%D1%83%D1%80%D1%81%D1%8B%20%D0%B0%D0%BD%D0%B3%D0%BB%D0%B8%D0%B9%D1%81%D0%BA%D0%BE%D0%B3%D0%BE",
    asanbay:  "https://2gis.kg/bishkek/search/%D0%90%D1%80%D1%81%D1%82%D0%B0%D0%BD%D0%B1%D0%B5%D0%BA%D0%B0%20%D0%94%D1%83%D0%B9%D1%88%D0%B5%D0%B5%D0%B2%D0%B0%206%2F4",
    filarm:   "https://2gis.kg/bishkek/search/%D0%BF%D1%80%D0%BE%D1%81%D0%BF%D0%B5%D0%BA%D1%82%20%D0%9C%D0%B0%D0%BD%D0%B0%D1%81%D0%B0%2064%2F1",
    tokmok:   "https://2gis.kg/tokmok/search/%D0%A8%D0%B0%D0%BC%D1%81%D0%B8%D0%BD%D1%81%D0%BA%D0%B0%D1%8F%2044"
  };
  window.SOwa = function(){
    document.querySelectorAll("a[data-wa]").forEach(function(a){
      a.href = WA + encodeURIComponent(a.dataset.wa || WA_DEF); a.target = "_blank"; a.rel = "noopener";
    });
    document.querySelectorAll("a[data-gis]").forEach(function(a){
      a.href = GIS[a.dataset.gis] || GIS[""]; a.target = "_blank"; a.rel = "noopener";
    });
  };
  window.SOwaLink = function(t){ return WA + encodeURIComponent(t); };
  window.SOreduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", window.SOwa); else window.SOwa();
})();

/* ===== Тест уровня: SOtest(элемент) — 10 вопросов → уровень → «Что дальше?»: WhatsApp с результатом или звонок ===== */
(function(){
  var Q=[
    ["She ___ from Bishkek.",["is","are","am","be"],0],
    ["There ___ two books on the table.",["is","are","be","am"],1],
    ["I ___ to the cinema yesterday.",["go","went","have gone","was go"],1],
    ["He usually ___ coffee in the morning.",["drink","drinks","drinking","is drink"],1],
    ["If it rains, we ___ at home.",["stay","will stay","would stay","stayed"],1],
    ["I've lived here ___ 2019.",["for","since","from","during"],1],
    ["This is the ___ film I've ever seen.",["good","better","best","most good"],2],
    ["The letter ___ yesterday.",["sent","was sent","has sent","is sending"],1],
    ["If I ___ you, I would take this job.",["am","was being","were","will be"],2],
    ["I wish I ___ more time last year.",["have","had","had had","would have"],2]
  ];
  var LV=[
    {n:"Beginner",t:"Начнём с нуля: группа Beginner, утром или вечером. Через 2–3 месяца — следующий уровень."},
    {n:"Elementary",t:"Подойдёт группа Elementary. Уже можно ходить в Talking Club — слушать и отвечать короткими фразами."},
    {n:"Pre-Intermediate",t:"Подойдёт группа Pre-Intermediate и Talking Club с носителем раз в неделю — чтобы заговорить свободнее."},
    {n:"Intermediate",t:"Вы уже говорите. Дальше — группа Intermediate или курс «Разговорный английский за 6 недель»."},
    {n:"Upper-Intermediate+",t:"Сильный уровень. Рекомендуем подготовку к IELTS по всем 4 секциям или индивидуальные занятия."}
  ];
  var MAP=[0,0,0,1,1,2,2,3,3,4,4];
  window.SOtest=function(el){
    var qi=0, ans=[], lock=false, n=Q.length;
    el.classList.add("qt");
    function draw(){
      var prog='<div class="qt-prog">'+Q.map(function(_,i){return '<i class="'+(i<=qi?"on":"")+'"></i>';}).join("")+'</div>';
      if(qi>=n){
        var sc=ans.filter(Boolean).length, r=LV[MAP[sc]];
        var wa="Здравствуйте! Прошёл(а) тест на сайте StudyOn: "+sc+" из 10, уровень "+r.n+". Хочу записаться на бесплатный пробный урок.";
        el.innerHTML=prog+'<div class="qt-res" aria-live="polite"><span class="qt-n">Ваш примерный уровень</span>'+
          '<div class="qt-lvl">'+r.n+'</div>'+
          '<div class="qt-dots" role="img" aria-label="'+sc+' из 10">'+ans.map(function(a){return '<i class="'+(a?"ok":"")+'"></i>';}).join("")+'</div>'+
          '<p><b>Правильных ответов: '+sc+' из 10. </b>'+r.t+'</p>'+
          '<div class="qt-next"><b>Что дальше? Отправьте результат — подберём группу и запишем на бесплатный пробный урок.</b>'+
          '<div class="qt-btns"><a class="qt-wa" target="_blank" rel="noopener" href="'+window.SOwaLink(wa)+'"><svg><use href="#i-wa"/></svg>Отправить в WhatsApp</a>'+
          '<a class="qt-call" href="tel:+996990313800"><svg><use href="#i-phone"/></svg>Позвонить</a>'+
          '<button class="qt-again" type="button">Пройти заново</button></div></div></div>';
        el.querySelector(".qt-again").onclick=function(){qi=0;ans=[];draw();};
        return;
      }
      var q=Q[qi];
      el.innerHTML=prog+'<span class="qt-n">Вопрос '+(qi+1)+' из '+n+' · вставьте пропущенное слово</span>'+
        '<div class="qt-q">'+q[0].replace("___","<u>&nbsp;?&nbsp;</u>")+'</div>'+
        '<div class="qt-opts">'+q[1].map(function(o,i){return '<button type="button" data-i="'+i+'">'+o+'</button>';}).join("")+'</div>';
      el.querySelectorAll(".qt-opts button").forEach(function(b){
        b.onclick=function(){
          if(lock)return; lock=true;
          var ok=+b.dataset.i===q[2]; ans.push(ok);
          el.querySelectorAll(".qt-opts button").forEach(function(x){x.disabled=true; if(+x.dataset.i===q[2])x.classList.add("ok");});
          if(!ok)b.classList.add("no");
          setTimeout(function(){lock=false;qi++;draw();},window.SOreduced?150:650);
        };
      });
    }
    draw();
  };
})();
</script>
